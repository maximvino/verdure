<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Verdure — build V -->
<title>Verdure</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
/* Marigold Vine / Verdure build V: the page now scrolls normally -- no
   more overflow:hidden/position:fixed lockdown. That earlier "single
   locked viewport, two independently-scrolling iframes" model was the
   actual source of the repeated floating/scrollbar bugs: two separate
   scroll contexts trying to fake being one thing. Now there is only ONE
   real scroll context (this page), Racine stays visually pinned via
   position:sticky (see .app-sticky below) instead of being its own
   scroll box, and Fleur's iframe is sized to match its true content
   height exactly (reported live, see the message listener) so it never
   has anything to scroll internally either. */
#stack{display:flex;flex-direction:column;min-height:100dvh}
.app{min-height:0;position:relative}
.app.app-sticky{position:sticky;top:0;z-index:10;background:#000}
.app iframe{width:100%;height:100%;border:none;display:block}
/* Only ever shown if a real app's path 404s — everything else stays invisible */
.load-error{
  display:none;position:absolute;inset:0;align-items:center;justify-content:center;
  background:#111;color:#888;font:13px sans-serif;text-align:center;padding:20px;
}
.load-error.show{display:flex}
/* A single, deliberate, near-invisible exception to "zero chrome" -- lets the
   context doc be downloaded from the live page itself rather than hand-sent.
   Fully transparent until hovered; tucked in a corner nothing else uses. */
#doc-btn{position:fixed;top:0;left:0;width:14px;height:14px;border:none;background:transparent;
  cursor:pointer;z-index:9999;padding:0;opacity:0;transition:opacity .2s}
#doc-btn:hover{opacity:.3;background:radial-gradient(circle,#fff 0%,transparent 70%)}
</style>
</head>
<body>

<div id="stack"></div>
<button id="doc-btn" title="Download Verdure context doc"></button>

<script>
// ── App registry ──────────────────────────────────────────────────
// Only real, deployed apps go here — nothing for apps that don't exist yet.
// Each entry stacks full-width, top to bottom, with zero visual separation
// between them (no border, no gap, no header) so it reads as one surface.
//   id      — internal key, used for DOM ids
//   label   — used only in the (normally invisible) load-error message
//   path    — relative path to the app's own index.html
//   version — appended as a ?v= query string on the iframe src. Bump this
//            every time (and ONLY when) that app's file actually changes.
//            Browsers/CDNs can keep serving a stale cached copy of an
//            iframe's content after a real update; a different URL
//            forces a genuinely fresh fetch instead.
//   height  — CSS flex-basis, used as the initial/fallback value before
//            the app's own reported height (via postMessage) arrives.
//   sticky  — true pins this app to the top of the page via
//            position:sticky while the rest of the page scrolls past it
//            underneath. Only Racine uses this; Fleur is normal flow.
const APPS=[
  {id:'racine', label:'Racine', path:'racine/', height:'170px', version:'V', sticky:true},
  {id:'fleur',  label:'Fleur',  path:'fleur/', height:'900px', version:'marigold-vine'},
];

const stack=document.getElementById('stack');
stack.innerHTML=APPS.map(app=>{
  const flex=app.height?`0 0 ${app.height}`:'1';
  const src=app.path+(app.version?`?v=${encodeURIComponent(app.version)}`:'');
  const cls=app.sticky?'app app-sticky':'app';
  return `
  <div class="${cls}" id="app-${app.id}" style="flex:${flex}">
    <iframe src="${src}" title="${app.label}" onerror="showLoadError('${app.id}')"></iframe>
    <div class="load-error" id="err-${app.id}">Couldn't load ${app.label} — expected it at /${app.path}</div>
  </div>`;
}).join('');

function showLoadError(id){
  document.getElementById('err-'+id)?.classList.add('show');
}

// ── Dynamic per-app height ─────────────────────────────────────────
// A child app (same-origin, so this is safe) can post
// {type:'app-resize', id:'<app id>', height:<px>} to ask for a specific
// height instead of the registry's fixed/initial value. Both Racine and
// Fleur (as of build V) use this — Racine to fit its day columns without
// internal scrolling, Fleur so it never scrolls internally at all, since
// the whole point of build V is that this outer page is the only thing
// that actually scrolls.
window.addEventListener('message', (e)=>{
  if(e.origin!==window.location.origin)return;
  const d=e.data;
  if(d&&d.type==='app-resize'&&d.id){
    const el=document.getElementById('app-'+d.id);
    if(el)el.style.flex=`0 0 ${d.height}px`;
  }
});

// ── Context doc (downloadable from the app itself) ────────────────
// IMPORTANT: keep this in sync with reality every time this file changes.
// Version bumps to the next Roman numeral on every version sent -- tracked
// here and in the <!-- Verdure — build N --> comment above, deliberately
// NOT in the <title> tag, which stays plain "Verdure".
const VERDURE_VERSION='V';
document.getElementById('doc-btn').addEventListener('click',()=>{
  const doc=`# Verdure — Project Context (build ${VERDURE_VERSION})

Paste this at the start of a new Claude conversation, then upload the current \`index.html\` (Verdure itself) if you're iterating on it, or the specific app's own context doc if you're iterating on one of the embedded apps instead. Generated live from the running page itself (the tiny invisible button in the top-left corner), so it reflects the build you're actually running.

## What this is

A personal browser-homepage made of independently-built apps, stacked full-bleed on one invisible page. Verdure itself has almost no visible UI — no header, no chrome, no visible boundary between apps under normal use.

## Current apps in the stack (top to bottom)

${APPS.map(a=>`- **${a.label}** — \`${a.path}\`${a.sticky?' (pinned to the top via position:sticky while the page scrolls past it)':''} (initial height ${a.height}, overridden live via postMessage once it reports its real content height)`).join('\\n')}

## Scroll architecture (build V — read this before touching height/scroll again)

Earlier builds tried to give Racine and Fleur each their own locked-viewport iframe (\`overflow:hidden\`, fixed heights, \`position:fixed\` on the outer page) and had them independently scroll internally. This repeatedly caused a "Racine floats/scrolls along with Fleur" bug, because two separate scroll contexts (Racine's iframe, Fleur's iframe, sometimes even the outer page) were fighting to behave like one seamless thing, and scroll gestures could "chain" between them in browser-dependent ways.

Build V removes the problem instead of patching around it again:
- The outer Verdure page has **no** \`overflow:hidden\`/\`position:fixed\` — it's a normal page that scrolls when its content is taller than the viewport, which it usually will be (Fleur's board can be tall).
- **Racine** is pinned via \`position:sticky;top:0\` on its \`.app\` wrapper (\`.app-sticky\` class, driven by \`sticky:true\` in the \`APPS\` registry) — a native, well-supported CSS feature, not a hand-rolled scroll trick.
- **Fleur** has no internal scrolling at all anymore. Its iframe is sized via \`postMessage\` to *exactly* match its real content height (a \`ResizeObserver\` inside Fleur's own file reports this continuously), so there's nothing to clip and nothing to scroll internally — the outer page handles all of the actual scrolling.
- Racine still uses its own small internal scrollbar for one specific edge case (a single day with an unusually large number of events, capped past \`MAX_H\` in Racine's own file) — that's intentional and unrelated to this bug.

If a future "floating"/stray-scrollbar bug shows up again, check whether some new element reintroduced its own \`overflow:auto\` scroll context that could conflict with this model, before assuming it's the same old bug.

## Versioning

Verdure uses Roman numerals (I, II, III...), bumped on every version sent, tracked in a source comment and in this generated doc — never in \`<title>\`, which stays plain "Verdure" on purpose. Racine has its own separate Roman-numeral counter; Fleur keeps its own flower-name convention. Three independent counters, matching each app's own release rhythm — not meant to be unified. Only files that actually changed get resent with a bumped version; an app with no code changes keeps its existing version number and isn't resent.

## Why this architecture

- **Isolation**: a bug in one app can't break another. Verdure itself has almost no logic.
- **No speculative UI** — the \`APPS\` registry only ever lists apps that are actually built and deployed.
- **Invisible by design** — no headers, borders, gaps, or labels. The one deliberate exception is this tiny context-doc button (fully transparent except on hover, tucked in the top-left corner) — added on explicit request, not a default. Any other visible Verdure-level chrome should still be treated as a real design decision to flag and discuss, not something to default into.

## Repo layout

\`\`\`
/                  ← Verdure's index.html lives at repo root
/racine/index.html ← Racine
/fleur/index.html  ← Fleur
\`\`\`

## Working method for future sessions

- Bump \`VERDURE_VERSION\` (Roman numeral) on every version sent, and re-sync this generated doc against whatever actually changed.
- Keep Verdure invisible. Any real feature, any visible UI, any placeholder for something not yet built belongs inside an app's own folder, not Verdure's file — the doc-download button is the one deliberate, minimal exception.
- Each app keeps (or gets) its own separate context doc — don't consolidate them into this one.
- Don't reintroduce \`overflow:hidden\`/\`position:fixed\` on this page without a genuinely new reason — re-read the Scroll architecture section above first.
`;
  const blob=new Blob([doc],{type:'text/markdown'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='verdure-context.md';
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
