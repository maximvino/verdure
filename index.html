<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Verdure — build 19 -->
<title>Verdure</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
/* Verdure build VIII: every prior build (locked-viewport iframes, then
   position:sticky, then position:fixed+margin-top) was solving a problem
   that was never actually the request. What was actually wanted is the
   simplest possible thing: Racine and Fleur are just two normal blocks,
   stacked one after another, on one normal page that scrolls as a single
   unit -- nothing pinned to the viewport, nothing fixed, nothing sticky.
   That's it. That's the whole fix. */
#stack{display:flex;flex-direction:column}
.app{width:100%}
.app iframe{width:100%;height:100%;border:none;display:block}
/* Only ever shown if a real app's path 404s — everything else stays invisible */
.load-error{
  display:none;position:absolute;inset:0;align-items:center;justify-content:center;
  background:#111;color:#888;font:13px sans-serif;text-align:center;padding:20px;
}
.load-error.show{display:flex}
/* A single, deliberate, near-invisible exception to "zero chrome" -- lets the
   context doc be downloaded from the live page itself rather than hand-sent.
   Fully transparent until hovered; tucked in a corner nothing else uses. */
#doc-btn{position:fixed;top:0;left:0;width:14px;height:14px;border:none;background:transparent;
  cursor:pointer;z-index:9999;padding:0;opacity:0;transition:opacity .2s}
#doc-btn:hover{opacity:.3;background:radial-gradient(circle,#fff 0%,transparent 70%)}
</style>
</head>
<body>

<div id="stack"></div>
<button id="doc-btn" title="Download Verdure context doc"></button>

<script>
// ── App registry ──────────────────────────────────────────────────
// Only real, deployed apps go here — nothing for apps that don't exist yet.
// Each entry stacks full-width, top to bottom, with zero visual separation
// between them (no border, no gap, no header) so it reads as one surface.
//   id      — internal key, used for DOM ids
//   label   — used only in the (normally invisible) load-error message
//   path    — relative path to the app's own index.html
//   version — appended as a ?v= query string on the iframe src. Bump this
//            every time (and ONLY when) that app's file actually changes.
//            Browsers/CDNs can keep serving a stale cached copy of an
//            iframe's content after a real update; a different URL
//            forces a genuinely fresh fetch instead.
//   height  — initial/fallback pixel height, used before the app's own
//            reported height (via postMessage) arrives.
const APPS=[
  {id:'branche', label:'Branche', path:'branche/', height:'220px', version:'12'},
  {id:'racine', label:'Racine', path:'racine/', height:'170px', version:'9'},
  {id:'fleur',  label:'Fleur',  path:'fleur/', height:'900px', version:'3'},
];

const stack=document.getElementById('stack');
stack.innerHTML=APPS.map(app=>{
  const src=app.path+(app.version?`?v=${encodeURIComponent(app.version)}`:'');
  return `
  <div class="app" id="app-${app.id}" style="height:${app.height||'400px'}">
    <iframe src="${src}" title="${app.label}" onerror="showLoadError('${app.id}')"></iframe>
    <div class="load-error" id="err-${app.id}">Couldn't load ${app.label} — expected it at /${app.path}</div>
  </div>`;
}).join('');

function showLoadError(id){
  document.getElementById('err-'+id)?.classList.add('show');
}

// ── Dynamic per-app height ─────────────────────────────────────────
// A child app (same-origin, so this is safe) can post
// {type:'app-resize', id:'<app id>', height:<px>} to ask for a specific
// height instead of the registry's initial value -- this is ONLY about
// sizing each app's iframe to match its real content (so neither app
// ever has its own internal scrollbar); it has nothing to do with
// pinning anything to the viewport anymore.
//
// {type:'modal-open'|'modal-close', id:'<app id>'} handles a separate,
// real problem: an app's iframe is normally only as tall as its own
// current content, which can be short -- and a position:fixed modal
// *inside* that iframe is boxed in by the iframe's actual rendered
// size, not the real browser viewport, so it can render squished into a
// tiny box. On modal-open, that app's iframe is temporarily grown to
// the full window height; modal-close lets the app's own next
// app-resize call put its real height back.
window.addEventListener('message', (e)=>{
  if(e.origin!==window.location.origin)return;
  const d=e.data;
  const el=d&&d.id&&document.getElementById('app-'+d.id);
  if(!el)return;
  if(d.type==='app-resize'){
    el.style.height=d.height+'px';
  }else if(d.type==='modal-open'){
    el.dataset.prevHeight=el.style.height;
    el.style.height=Math.max(window.innerHeight,600)+'px';
  }else if(d.type==='modal-close'){
    if(el.dataset.prevHeight)el.style.height=el.dataset.prevHeight;
  }
});

// ── Context doc (downloadable from the app itself) ────────────────
// IMPORTANT: keep this in sync with reality every time this file changes.
// Version bumps to the next plain number on every version sent -- tracked
// here and in the <!-- Verdure — build N --> comment above, deliberately
// NOT in the <title> tag, which stays plain "Verdure". Switched from Roman
// numerals to plain numbers as of build 13 (project-wide convention change,
// alongside Branche and Racine; Fleur keeps its own flower-name convention).
const VERDURE_VERSION='19';
document.getElementById('doc-btn').addEventListener('click',()=>{
  const doc=`# Verdure — Project Context (build ${VERDURE_VERSION})

Paste this at the start of a new Claude conversation, then upload the current \`index.html\` (Verdure itself) if you're iterating on it, or the specific app's own context doc if you're iterating on one of the embedded apps instead. Generated live from the running page itself (the tiny invisible button in the top-left corner), so it reflects the build you're actually running.

## What this is

A personal browser-homepage made of independently-built apps, stacked full-bleed on one invisible page. Verdure itself has almost no visible UI — no header, no chrome, no visible boundary between apps under normal use.

## Current apps in the stack (top to bottom)

${APPS.map(a=>`- **${a.label}** — \`${a.path}\` (initial height ${a.height}, overridden live via postMessage once it reports its real content height)`).join('\\n')}

## Scroll architecture (build VIII — read this before touching height/scroll again)

Three builds got this wrong before landing on the actually-correct, much simpler model:
1. Two independently-scrolling locked-viewport iframes (builds ≤IV) — scroll gestures could "chain" between them in browser-dependent ways.
2. \`position:sticky\` for Racine (builds V-VI) — iOS Safari has long-standing bugs with sticky on an element containing an iframe inside a flex context; it visually detached and covered Fleur while scrolling on Safari mobile.
3. \`position:fixed\` for Racine with a JS-computed \`margin-top\` offset on Fleur (build VII) — more robust than sticky, but still solving a problem that was never actually the request: it kept Racine pinned to the viewport, which is not what "static" meant. It also had its own edge cases (a visible gap during viewport resize/scroll on mobile, from the fixed element and the offset briefly disagreeing).

**Build VIII removes the pinning idea entirely.** Racine and Fleur are both completely normal, non-positioned blocks (\`position\` is not set at all — default \`static\`) stacked in a plain \`display:flex;flex-direction:column\` column, on a page with no \`overflow\`, no \`position:fixed\`, nothing pinned to the viewport anywhere. The whole page scrolls as one ordinary unit, the same way any two divs on any webpage would. Racine simply appears above Fleur and scrolls away with it when you scroll past it — there is no mechanism keeping it on screen, because none was ever actually wanted.

The \`postMessage\` height-reporting from Racine and Fleur is unchanged and still needed — that part was never the bug. It exists purely so each iframe's height matches its real content (so neither has its own internal scrollbar), which is a completely separate concern from viewport-pinning.

## Modal full-height requests (build XI)

An app's iframe is normally only as tall as its own current content. That's fine for the app's normal display, but a \`position:fixed\` modal *inside* an iframe is boxed in by that iframe's actual rendered size, not the real browser viewport — so a short app (Branche especially, before it has much content) could render its own modals squished into a tiny box. Apps can now post \`{type:'modal-open', id}\` before opening a modal to temporarily get a full-viewport-height iframe, and \`{type:'modal-close', id}\` when it closes (after which the app's own next \`app-resize\` call restores its real height). Branche uses this as of its build III; any other app with modals should adopt the same pattern rather than re-solving this.

If a future "floating"/overlap bug shows up again: **do not reach for position:fixed or position:sticky on either app's wrapper.** Both were tried and both caused real problems. The correct model is exactly what's in this build — plain flow, no positioning.

## Page heading (build 13, restyled in Branche build 9 — see Branche's own doc)

Verdure wanted a heading; rather than add a header bar to this invisible shell, it's implemented at the top of Branche's own tree. The first attempt (Branche build 8) was a baobab-crown motif; that didn't read well and was replaced (Branche build 9) with a plain star holding a small "V". Lives entirely in Branche's own file (\`#canopy\`, inside its \`#app\` so its existing \`ResizeObserver\` picks it up automatically) — nothing in Verdure's own file changed to support either version. See Branche's own context doc for the current implementation details; don't assume the description here is current if it's been a while.

## Versioning

Verdure uses plain numbers (1, 2, 3...), bumped on every version sent, tracked in a source comment and in this generated doc — never in \`<title>\`, which stays plain "Verdure" on purpose. Switched from Roman numerals to plain numbers as of build 13, a project-wide convention change made together with Branche and Racine; Fleur keeps its own flower-name convention, unaffected. Racine and Branche each keep their own separate numeric counter — three independent counters, matching each app's own release rhythm, not meant to be unified. Only files that actually changed get resent with a bumped version; an app with no code changes keeps its existing version number and isn't resent.

## Why this architecture

- **Isolation**: a bug in one app can't break another. Verdure itself has almost no logic.
- **No speculative UI** — the \`APPS\` registry only ever lists apps that are actually built and deployed.
- **Invisible by design, with two deliberate exceptions**: this tiny context-doc button (fully transparent except on hover, tucked in the top-left corner), and, as of build 13, the page heading living at the top of Branche's tree (see above) — both added on explicit request, not defaults. Any other visible Verdure-level chrome should still be treated as a real design decision to flag and discuss, not something to default into.

## Repo layout

\`\`\`
/                  ← Verdure's index.html lives at repo root
/branche/index.html ← Branche
/racine/index.html ← Racine
/fleur/index.html  ← Fleur
\`\`\`

## Working method for future sessions

- Bump \`VERDURE_VERSION\` (plain number) on every version sent, and re-sync this generated doc against whatever actually changed.
- Keep Verdure invisible. Any real feature, any visible UI, any placeholder for something not yet built belongs inside an app's own folder, not Verdure's file — the doc-download button is the one deliberate, minimal exception.
- Each app keeps (or gets) its own separate context doc — don't consolidate them into this one.
- Don't reintroduce \`overflow:hidden\`/\`position:fixed\` on this page without a genuinely new reason — re-read the Scroll architecture section above first.
`;
  const blob=new Blob([doc],{type:'text/markdown'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='verdure-context.md';
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
