<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Verdure — build IV -->
<title>Verdure</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;height:100dvh; /* 100dvh handles mobile browser chrome resizing; 100% is the fallback */
  overflow:hidden;overscroll-behavior:none;background:#000;
  position:fixed;inset:0;width:100%; /* locks the page in place -- fixes the "floats while scrolling"
    bug on mobile, caused by iOS rubber-banding a page that's technically still scrollable even
    with overflow:hidden once the browser chrome collapses/expands */
}
#stack{height:100%;height:100dvh;display:flex;flex-direction:column}
.app{min-height:0;position:relative}
.app iframe{width:100%;height:100%;border:none;display:block}
/* Only ever shown if a real app's path 404s — everything else stays invisible */
.load-error{
  display:none;position:absolute;inset:0;align-items:center;justify-content:center;
  background:#111;color:#888;font:13px sans-serif;text-align:center;padding:20px;
}
.load-error.show{display:flex}
/* A single, deliberate, near-invisible exception to "zero chrome" -- lets the
   context doc be downloaded from the live page itself rather than hand-sent.
   Fully transparent until hovered; tucked in a corner nothing else uses. */
#doc-btn{position:fixed;top:0;left:0;width:14px;height:14px;border:none;background:transparent;
  cursor:pointer;z-index:9999;padding:0;opacity:0;transition:opacity .2s}
#doc-btn:hover{opacity:.3;background:radial-gradient(circle,#fff 0%,transparent 70%)}
</style>
</head>
<body>

<div id="stack"></div>
<button id="doc-btn" title="Download Verdure context doc"></button>

<script>
// ── App registry ──────────────────────────────────────────────────
// Only real, deployed apps go here — nothing for apps that don't exist yet.
// Each entry stacks full-width, top to bottom, with zero visual separation
// between them (no border, no gap, no header) so it reads as one surface.
//   id     — internal key, used for DOM ids
//   label  — used only in the (normally invisible) load-error message
//   path   — relative path to the app's own index.html
//   version — appended as a ?v= query string on the iframe src. Bump this
//            every time that app's file changes. This exists because
//            browsers and GitHub Pages' CDN can keep serving a cached
//            copy of an iframe's content for a while after you've pushed
//            a real update -- a different URL (via the version bump)
//            forces a genuinely fresh fetch instead of a stale cached one.
//            This was the actual cause of a deployed update appearing
//            identical to the previous version despite the file being
//            correctly replaced.
//   height — CSS flex-basis for this app's share of the stack, used only
//            as an initial/fallback value. Apps that know their own
//            correct height (like Racine, as of its build IV) report it
//            live via postMessage and override this after they load —
//            see the message listener below. Omit height (or use 'auto')
//            for an app that should just fill whatever's left over (Fleur).
const APPS=[
  {id:'racine', label:'Racine', path:'racine/', height:'170px', version:'V'},
  {id:'fleur',  label:'Fleur',  path:'fleur/', version:'marigold-petal'},
];

const stack=document.getElementById('stack');
stack.innerHTML=APPS.map(app=>{
  const flex=app.height?`0 0 ${app.height}`:'1';
  const src=app.path+(app.version?`?v=${encodeURIComponent(app.version)}`:'');
  return `
  <div class="app" id="app-${app.id}" style="flex:${flex}">
    <iframe src="${src}" title="${app.label}" onerror="showLoadError('${app.id}')"></iframe>
    <div class="load-error" id="err-${app.id}">Couldn't load ${app.label} — expected it at /${app.path}</div>
  </div>`;
}).join('');

function showLoadError(id){
  document.getElementById('err-'+id)?.classList.add('show');
}

// ── Dynamic per-app height ─────────────────────────────────────────
// A child app (same-origin, so this is safe) can post
// {type:'app-resize', id:'<app id>', height:<px>} to ask for a specific
// height instead of the registry's fixed/initial value. Racine uses this
// as of its build IV so day columns with a normal number of events don't
// need their own internal scrollbar.
window.addEventListener('message', (e)=>{
  if(e.origin!==window.location.origin)return;
  const d=e.data;
  if(d&&d.type==='app-resize'&&d.id){
    const el=document.getElementById('app-'+d.id);
    if(el)el.style.flex=`0 0 ${d.height}px`;
  }
});

// ── Context doc (downloadable from the app itself) ────────────────
// IMPORTANT: keep this in sync with reality every time this file changes.
// Version bumps to the next Roman numeral on every version sent -- tracked
// here and in the <!-- Verdure — build N --> comment above, deliberately
// NOT in the <title> tag, which stays plain "Verdure".
const VERDURE_VERSION='IV';
document.getElementById('doc-btn').addEventListener('click',()=>{
  const doc=`# Verdure — Project Context (build ${VERDURE_VERSION})

Paste this at the start of a new Claude conversation, then upload the current \`index.html\` (Verdure itself) if you're iterating on it, or the specific app's own context doc if you're iterating on one of the embedded apps instead. Generated live from the running page itself (the tiny invisible button in the top-left corner), so it reflects the build you're actually running.

## What this is

A personal browser-homepage made of independently-built apps, stacked full-bleed on one invisible page. Verdure itself has almost no visible UI — no header, no chrome, no visible boundary between apps under normal use.

## Current apps in the stack (top to bottom)

${APPS.map(a=>`- **${a.label}** — \`${a.path}\`${a.height?` (initial height ${a.height}, may be overridden live via postMessage)`:' (fills remaining space)'}`).join('\\n')}

## Versioning

Verdure uses Roman numerals (I, II, III...), bumped on every version sent, tracked in a source comment and in this generated doc — never in \`<title>\`, which stays plain "Verdure" on purpose (kept out of the tab title deliberately, per an explicit request, even though it's useful for telling builds apart). This is Verdure's own convention, separate from Racine's Roman numerals and separate from Fleur's flower-name convention — each app keeps whatever versioning scheme suits it.

## Dynamic per-app height (build III)

Child apps can request their own height instead of using the registry's fixed value, by posting \`{type:'app-resize', id, height}\` to \`window.parent\` (safe same-origin call, since every app is served from the same domain as Verdure, just a different path). Verdure listens on \`window.addEventListener('message', ...)\`, checks \`e.origin\` matches its own origin, and updates that app's flex-basis live. The \`height\` field in the \`APPS\` registry is now just the *initial* value shown before any such message arrives — treat it as a fallback, not a hard limit, for any app that implements this.

## Mobile scroll/rubber-band fix (build III)

Earlier versions used \`height:100%\` on \`html,body\`, which on mobile browsers can be taller than the actually-visible viewport once the browser's own address-bar chrome collapses/expands — this let the whole page rubber-band-scroll slightly, making Racine appear to "float" relative to Fleur instead of staying static. Fixed with \`height:100dvh\` (dynamic viewport height, tracks the real visible area) plus \`position:fixed;inset:0\` and \`overscroll-behavior:none\` on \`html,body\`, which locks the page in place entirely.

## Why this architecture

- **Isolation**: a bug in one app can't break another. Verdure itself has almost no logic.
- **Independent versioning**: each app is released and rolled back on its own schedule, with its own convention (Fleur's flower names, Racine's Roman numerals, Verdure's Roman numerals — three separate counters, not shared).
- **No speculative UI** — the \`APPS\` registry only ever lists apps that are actually built and deployed.
- **Invisible by design** — no headers, borders, gaps, or labels. The one deliberate exception is this tiny context-doc button (fully transparent except on hover, tucked in the top-left corner) — added on explicit request, not a default. Any other visible Verdure-level chrome should still be treated as a real design decision to flag and discuss, not something to default into.

## Repo layout

\`\`\`
/                  ← Verdure's index.html lives at repo root
/racine/index.html ← Racine
/fleur/index.html  ← Fleur
\`\`\`

## Working method for future sessions

- Bump \`VERDURE_VERSION\` (Roman numeral) on every version sent, and re-sync this generated doc against whatever actually changed.
- Keep Verdure invisible. Any real feature, any visible UI, any placeholder for something not yet built belongs inside an app's own folder, not Verdure's file — the doc-download button is the one deliberate, minimal exception.
- Each app keeps (or gets) its own separate context doc — don't consolidate them into this one.
`;
  const blob=new Blob([doc],{type:'text/markdown'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='verdure-context.md';
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
