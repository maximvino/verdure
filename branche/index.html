<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- Branche — build 9 -->
<title>Branche</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#0e1c12;
  --surface:#17281a;
  --ink:#f3ead6;
  --ink2:#c3b394;
  --ink3:#8a7c62;
  --border:rgba(224,198,150,.1);
  --border2:rgba(224,198,150,.18);
  --root:#7f9767;
  --bark:#4d6b42;
  --knot:#2f2013;
  --danger:#c9705a;
  --font-h:'Lora',Georgia,serif;
  --font-b:'DM Sans',sans-serif;
}
html,body{background:var(--page);color:var(--ink);font-family:var(--font-b);overflow-x:hidden}
#app{padding:20px 16px 30px;min-height:60px}

/* ── Tree: fully deterministic, JS-computed absolute positions.
   No SVG anywhere -- plain brown rectangles for trunk/branches, a CSS
   "blob" for the knot, and a simple two-corner-radius CSS shape for
   every leaf (all identical size), by explicit request after the
   previous freeform/organic SVG version didn't render as intended and
   couldn't be visually checked before deploying. ── */
#desktop-tree{position:relative;max-width:900px;margin:0 auto}
.trunk-el{position:absolute;background:var(--bark);opacity:.9}
.branch-el{position:absolute;background:var(--bark);opacity:.9}
.knot{position:absolute;background:var(--knot);cursor:pointer;opacity:.92;
  border-radius:46% 54% 52% 48%/55% 45% 55% 45%}
.knot:hover{filter:brightness(1.2)}

.leaf-anchor{position:absolute;width:0;height:0}
.leaf-wrap{position:absolute;left:0;top:0;transform-origin:0 0}
.leaf-shape{position:absolute;cursor:pointer;opacity:.82;border-radius:50%}
.leaf-icon-wrap{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none}
.leaf-icon-wrap img{width:65%;height:65%;object-fit:contain}

#mobile-compact{display:none;padding:16px}
@media (max-width:640px){#desktop-tree{display:none}#mobile-compact{display:block}}
#mobile-tree{position:relative;cursor:pointer}
.mobile-knot-btn{width:44px;height:44px;background:var(--knot);border:none;cursor:pointer;opacity:.9;
  border-radius:46% 54% 52% 48%/55% 45% 55% 45%}
.mobile-maxi-tree{position:relative;min-height:200px}

/* ── Canopy heading: the page's one heading. The baobab-crown treatment
   didn't read well (per feedback, "looking terrible") -- replaced with a
   plain star holding a small "V", simple enough to not fight with the
   tree underneath it while still sitting up top like a small badge/mark
   rather than a header bar. Star drawn with clip-path (no SVG, consistent
   with the rest of this file's plain-shape approach). ── */
#canopy{display:flex;justify-content:center;padding:10px 0 2px;user-select:none}
.canopy-star{position:relative;width:36px;height:36px;background:var(--root);
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  display:flex;align-items:center;justify-content:center}
.canopy-star-v{font-family:var(--font-h);font-weight:600;font-size:14px;color:var(--page);
  margin-top:7px} /* nudges the V down into the star's visual (not bounding-box) center */

/* ── Edit pane (opened only via the knot) ── */
.modal{position:fixed;inset:0;background:rgba(10,7,3,.72);display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px}
.modal.hidden{display:none}
.modal-card{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:20px;
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.5);
  display:flex;flex-direction:column;gap:14px}
.modal-card h2{font-family:var(--font-h);font-weight:500;font-size:1.1rem}
.branch-block{border:1px solid var(--border);border-radius:10px;padding:10px}
.branch-block-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.branch-name-input{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:6px;padding:4px 8px;font-size:.78rem;color:var(--ink);font-family:var(--font-b);outline:none}
.branch-block-hdr .moves{display:flex;gap:4px}
.tiny-btn{background:rgba(255,255,255,.06);border:none;color:var(--ink2);border-radius:5px;
  font-size:11px;padding:3px 6px;cursor:pointer}
.tiny-btn:hover{background:rgba(255,255,255,.12)}
.tiny-btn.danger{color:var(--danger)}
.leaf-edit-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border)}
.leaf-edit-row img{width:24px;height:24px;object-fit:contain;flex-shrink:0}
.leaf-edit-row input[type=url]{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:6px;padding:5px 8px;font-size:.75rem;color:var(--ink);font-family:var(--font-b);outline:none}
.leaf-edit-row input[type=color]{width:22px;height:22px;border:none;padding:0;border-radius:50%;cursor:pointer;background:none}
.leaf-edit-row input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.leaf-edit-row input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
.leaf-name-input{background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:6px;padding:5px 6px;font-size:.72rem;color:var(--ink);font-family:var(--font-b);outline:none}
.add-leaf-btn,.add-branch-btn{background:none;border:1.5px dashed var(--root);color:var(--root);
  border-radius:8px;padding:6px 10px;font-size:.75rem;cursor:pointer;font-family:var(--font-b)}
.add-leaf-btn{margin-top:8px;width:100%}
.add-branch-btn{width:100%;padding:10px}
/* Export/import backup -- a safety net independent of localStorage itself,
   same pattern Fleur and Racine already use for their own data. */
.backup-row{display:flex;gap:14px;justify-content:center;padding:10px 0 2px}
.link-btn{background:none;border:none;color:var(--root);font-family:var(--font-b);
  font-size:.72rem;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:2px}
.link-btn:hover{color:var(--ink2)}
.modal-actions{display:flex;justify-content:flex-end}
.btn-done{background:none;border:1px solid var(--border2);color:var(--ink2);border-radius:20px;
  padding:6px 16px;font-family:var(--font-b);font-size:.78rem;cursor:pointer}
.btn-done:hover{background:rgba(255,255,255,.05)}

/* ── Nested icon-search modal (opened from a leaf row's "icon" button) ── */
.icon-search-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;
  max-height:340px;overflow-y:auto;padding:4px}
.icon-search-results .res{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;background:rgba(255,255,255,.05)}
.icon-search-results .res:hover{background:rgba(190,220,170,.22)}
.icon-search-results .res img{width:65%;height:65%;object-fit:contain}
.icon-search-status{color:var(--ink3);font-size:.72rem;text-align:center;padding:8px 0}
.modal-card input[type=text]{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:8px;padding:9px 11px;font-size:.85rem;color:var(--ink);font-family:var(--font-b);outline:none}
.btn-primary{background:var(--root);color:var(--page);border:none;border-radius:8px;
  padding:9px 16px;font-family:var(--font-b);font-weight:600;font-size:.8rem;cursor:pointer}
.btn-primary:hover{filter:brightness(1.1)}
#doc-btn{position:fixed;bottom:0;right:0;width:14px;height:14px;border:none;background:transparent;
  cursor:pointer;z-index:9999;padding:0;opacity:0;transition:opacity .2s}
#doc-btn:hover{opacity:.3;background:radial-gradient(circle,#fff 0%,transparent 70%)}
</style>
</head>
<body>

<div id="app">
  <div id="canopy">
    <div class="canopy-star" title="Verdure"><span class="canopy-star-v">V</span></div>
  </div>
  <div id="desktop-tree"></div>
  <div id="mobile-compact"><div id="mobile-tree" title="Tap to view full size"></div></div>
</div>
<button id="doc-btn" title="Download Branche context doc"></button>

<div class="modal hidden" id="mobile-maxi-modal">
  <div class="modal-card" style="max-width:420px">
    <h2>Branche</h2>
    <div class="mobile-maxi-tree" id="mobile-maxi-tree"></div>
    <div class="modal-actions"><button class="btn-done" id="close-mobile-maxi">Done</button></div>
  </div>
</div>

<div class="modal hidden" id="edit-modal">
  <div class="modal-card">
    <h2>Edit Branche</h2>
    <div id="edit-branches"></div>
    <button class="add-branch-btn" id="add-branch-btn">+ Add branch</button>
    <div class="backup-row">
      <button class="link-btn" id="export-btn">Export backup</button>
      <button class="link-btn" id="import-btn">Import backup</button>
      <input type="file" id="import-file" accept="application/json" style="display:none">
    </div>
    <div class="modal-actions"><button class="btn-done" id="close-edit">Done</button></div>
  </div>
</div>

<div class="modal hidden" id="icon-pick-modal">
  <div class="modal-card">
    <h2>Choose an icon</h2>
    <input type="text" id="icon-query" placeholder="Search (e.g. youtube)">
    <div class="icon-search-status" id="icon-search-status"></div>
    <div class="icon-search-results" id="icon-search-results"></div>
    <div class="modal-actions"><button class="btn-done" id="close-icon-pick">Cancel</button></div>
  </div>
</div>

<script>
// ── Storage ──────────────────────────────────────────────────────
const BRANCHES_KEY='branche_branches';
const LINKS_KEY='branche_links';
const SYNC_KEY='branche_sync_endpoint';
const DEFAULT_SYNC='https://oldfleurplanner.netlify.app/api/sync';
const SYNC_ROW_ID=3;
const DEFAULT_LEAF_COLOR='#7f9767';
const DEFAULT_ICON_COLOR='#f3ead6';

function loadBranchesLocal(){try{return JSON.parse(localStorage.getItem(BRANCHES_KEY))||[];}catch(e){return [];}}
function saveBranchesLocal(v){localStorage.setItem(BRANCHES_KEY,JSON.stringify(v));}
function loadLinksLocal(){try{return JSON.parse(localStorage.getItem(LINKS_KEY))||[];}catch(e){return [];}}
function saveLinksLocal(v){localStorage.setItem(LINKS_KEY,JSON.stringify(v));}
function loadSyncEndpoint(){return localStorage.getItem(SYNC_KEY)||DEFAULT_SYNC;}

let branches=loadBranchesLocal();
let links=loadLinksLocal();

function migrateOrphanedLinks(){
  const branchIds=new Set(branches.map(b=>b.id));
  const orphans=links.filter(l=>!l.branchId||!branchIds.has(l.branchId));
  if(!orphans.length)return false;
  let home=branches[0];
  if(!home){home={id:'branch_recovered_'+Date.now()};branches.push(home);}
  orphans.forEach(l=>{l.branchId=home.id;});
  return true;
}
if(migrateOrphanedLinks()){saveBranchesLocal(branches);saveLinksLocal(links);}

// ── Cross-device sync (push-only from a device with existing data;
// only a genuinely empty device pulls -- see build III notes) ──────
let cloudSyncFailed=false;
async function loadFromCloud(){
  if(links.length||branches.length){saveToCloud();return false;}
  try{
    const res=await fetch(loadSyncEndpoint(),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'load',id:SYNC_ROW_ID})});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(data&&data.state&&(Array.isArray(data.state.links)||Array.isArray(data.state.branches))){
      links=data.state.links||[];branches=data.state.branches||[];
      migrateOrphanedLinks();
      saveBranchesLocal(branches);saveLinksLocal(links);
      renderAll();
      return true;
    }
    return false;
  }catch(err){cloudSyncFailed=true;return false;}
}
async function saveToCloud(){
  try{
    const res=await fetch(loadSyncEndpoint(),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'save',id:SYNC_ROW_ID,state:{branches,links}})});
    cloudSyncFailed=!res.ok;
  }catch(err){cloudSyncFailed=true;}
}
function persist(){saveBranchesLocal(branches);saveLinksLocal(links);saveToCloud();}

// ── Icon rendering ───────────────────────────────────────────────
function iconUrl(icon,size,color){
  const [prefix,name]=icon.split(':');
  const c=encodeURIComponent(color||DEFAULT_ICON_COLOR);
  return `https://api.iconify.design/${prefix}/${name}.svg?height=${size||64}&color=${c}`;
}

// ── Deterministic tree layout (no measuring, no randomness) ─────────
// Parameterized by a `scale` (for mobile's mini/maxi sizes) and a
// `sideMount` flag: desktop centers the trunk with branches alternating
// left/right; sideMount pins the trunk near one edge with every branch
// extending the same direction (the only side that has visible room).
const TRUNK_WIDTH=64, BRANCH_THICKNESS=14, BRANCH_V_GAP=140, LEAF_SPACING=70,
      LEAF_LENGTH=56, LEAF_WIDTH=44, ICON_SIZE_RATIO=.75, KNOT_SIZE=38,
      KNOT_GAP_AFTER_LAST_BRANCH=64, BOTTOM_PAD=24, TOP_PAD=24, EDGE_MARGIN=10;

function computeLayout(containerWidth,opts){
  opts=opts||{};
  const scale=opts.scale||1;
  const sideMount=!!opts.sideMount;
  const tw=TRUNK_WIDTH*scale, bt=BRANCH_THICKNESS*scale, bvg=BRANCH_V_GAP*scale,
        ls=LEAF_SPACING*scale, ll=LEAF_LENGTH*scale, lw=LEAF_WIDTH*scale,
        knotSize=KNOT_SIZE*scale, gap=KNOT_GAP_AFTER_LAST_BRANCH*scale,
        bottomPad=BOTTOM_PAD*scale, topPad=TOP_PAD*scale, edgeMargin=EDGE_MARGIN*scale;
  const stub=tw/2+16*scale;
  const centerX=sideMount?(tw/2+edgeMargin):containerWidth/2;
  let y=topPad;
  // Branches used to alternate left/right by simple index parity
  // (bi%2===0?'left':'right'). The trunk itself was always mathematically
  // centered on centerX, but that alternation ignored how much each side
  // actually weighed -- an odd branch count, or one branch with far more
  // links than another, always left one side visibly heavier, which read
  // as the whole tree being off-center even though the trunk wasn't.
  // Assigning each branch to whichever side currently carries less total
  // link weight keeps the silhouette actually balanced regardless of how
  // many branches or links exist.
  let leftWeight=0,rightWeight=0;
  const branchLayouts=branches.map((branch,bi)=>{
    const branchLinks=links.filter(l=>l.branchId===branch.id);
    const weight=branchLinks.length||1; // an empty branch still has visual weight (its own stub)
    let side;
    if(sideMount)side='right';
    else if(leftWeight<rightWeight)side='left';
    else if(rightWeight<leftWeight)side='right';
    else side=bi%2===0?'left':'right'; // tied: alternate, still deterministic
    if(!sideMount){if(side==='left')leftWeight+=weight;else rightWeight+=weight;}
    const dir=sideMount?1:(side==='left'?-1:1);
    // Each leaf's BASE (attachment point) sits at stub + li*spacing; the
    // branch's own rendered length ends exactly at the LAST leaf's base,
    // not extending past it -- the leaf's own body may still reach
    // further out once tilted, same as a real leaf tilts away from its
    // twig, but the branch line itself stops where the leaves are.
    const lastBaseOffset=stub+Math.max(branchLinks.length-1,0)*ls;
    const leafLayouts=branchLinks.map((link,li)=>({
      link,
      x:centerX+dir*(stub+li*ls),
      rotSign:li%2===0?1:-1
    }));
    const row={branch,side,dir,y,x0:centerX+dir*(tw/2),x1:centerX+dir*lastBaseOffset,leaves:leafLayouts};
    y+=bvg;
    return row;
  });
  const lastBranchY=branchLayouts.length?branchLayouts[branchLayouts.length-1].y:topPad;
  const knotY=lastBranchY+gap;
  const trunkHeight=knotY+knotSize/2+bottomPad;
  return {centerX,trunkHeight,knotY,branchLayouts,scale,tw,bt,ll,lw,knotSize};
}

function renderAll(){renderTree();renderMobileTree();}

// Shared renderer: builds the HTML for one tree instance into `container`
// at the given layout, and wires up click/knot handlers. Used for the
// desktop tree, the small "minimized" mobile tree, and the full-size
// "maximized" mobile overlay tree alike.
function renderTreeInto(container,layout,onKnotClick){
  let html=`<div class="trunk-el" style="left:${layout.centerX-layout.tw/2}px;top:0;width:${layout.tw}px;height:${layout.trunkHeight}px"></div>`;

  layout.branchLayouts.forEach(row=>{
    const left=Math.min(row.x0,row.x1);
    const w=Math.abs(row.x1-row.x0);
    html+=`<div class="branch-el" style="left:${left}px;top:${row.y-layout.bt/2}px;width:${w}px;height:${layout.bt}px"></div>`;
    // Baseline: a leaf lies flat pointing the SAME direction the branch
    // extends (its base and tip both resting on the branch line). The
    // only rotation applied from there is a ±45° tilt of the whole leaf
    // around its BASE (the point actually touching the branch) -- tip
    // lifting toward the sky (-45° from baseline) or dropping toward the
    // ground (+45°), alternating leaf to leaf. Nothing else feeds into
    // the angle: no separate "above/below attachment" concept, no
    // per-side sign flip beyond the baseline direction itself.
    const baselineRot=row.dir===1?0:180;
    row.leaves.forEach(leafInfo=>{
      const {link,x,rotSign}=leafInfo;
      const leafColor=link.leafColor||DEFAULT_LEAF_COLOR;
      const iconColor=link.iconColor||DEFAULT_ICON_COLOR;
      const tilt=rotSign>0?-45:45; // -45 = tip up (sky), +45 = tip down (ground)
      const rot=baselineRot+tilt;
      const title=link.name?link.name:link.url;
      const iconSize=layout.lw*ICON_SIZE_RATIO;
      // Leaf-shape spans local x:[0, ll] (base at the anchor, extending
      // outward along the baseline direction), centered on the branch
      // line vertically (y:[-lw/2, +lw/2]) before rotation.
      html+=`<div class="leaf-anchor" style="left:${x}px;top:${row.y}px">
        <div class="leaf-wrap" style="transform:rotate(${rot}deg)">
          <div class="leaf-shape" data-id="${link.id}" title="${title}" style="left:0px;top:${-layout.lw/2}px;width:${layout.ll}px;height:${layout.lw}px;background:${leafColor}"></div>
          <div class="leaf-icon-wrap" title="${title}" style="left:${layout.ll/2-iconSize/2}px;top:${-iconSize/2}px;width:${iconSize}px;height:${iconSize}px;transform:rotate(${-rot}deg)">
            <img src="${iconUrl(link.icon,32,iconColor)}" alt="" loading="lazy">
          </div>
        </div>
      </div>`;
    });
  });

  html+=`<div class="knot" title="Edit Branche" style="left:${layout.centerX-layout.knotSize/2}px;top:${layout.knotY-layout.knotSize*.4}px;width:${layout.knotSize}px;height:${layout.knotSize*.8}px"></div>`;

  container.style.height=layout.trunkHeight+layout.knotSize/2+'px';
  container.innerHTML=html;

  container.querySelectorAll('.leaf-shape').forEach(el=>{
    el.addEventListener('click',()=>{
      const link=links.find(l=>l.id===el.getAttribute('data-id'));
      if(link)window.open(link.url,'_blank','noopener');
    });
  });
  const knotEl=container.querySelector('.knot');
  if(knotEl)knotEl.addEventListener('click',onKnotClick||openEditPane);
}

function renderTree(){
  const container=document.getElementById('desktop-tree');
  const width=container.getBoundingClientRect().width||600;
  const layout=computeLayout(width,{scale:1,sideMount:false});
  renderTreeInto(container,layout,openEditPane);
  reportHeight();
}
window.addEventListener('resize',()=>{renderTree();renderMobileTree();});

// Mobile: trunk pinned to the left edge, every branch extending
// rightward (the only direction with visible room), shown small by
// default ("minimized") and tappable to view at full size in a
// full-height overlay ("maximized") -- same knot, same editing.
const MOBILE_MINI_SCALE=.42;
function renderMobileTree(){
  const container=document.getElementById('mobile-tree');
  if(!container)return;
  const width=container.getBoundingClientRect().width||360;
  const layout=computeLayout(width,{scale:MOBILE_MINI_SCALE,sideMount:true});
  renderTreeInto(container,layout,openMaximizedMobileTree);
  container.onclick=(e)=>{
    if(!e.target.closest('.leaf-shape')&&!e.target.closest('.knot'))openMaximizedMobileTree();
  };
}
function openMaximizedMobileTree(){
  requestFullHeight();
  document.getElementById('mobile-maxi-modal').classList.remove('hidden');
  renderMaximizedMobileTree();
}
function renderMaximizedMobileTree(){
  const container=document.getElementById('mobile-maxi-tree');
  const width=container.getBoundingClientRect().width||360;
  const layout=computeLayout(width,{scale:.85,sideMount:true});
  renderTreeInto(container,layout,openEditPane);
}
document.getElementById('close-mobile-maxi').addEventListener('click',()=>{
  document.getElementById('mobile-maxi-modal').classList.add('hidden');
  releaseFullHeight();
});



// ── Edit pane (the ONLY place any controls beyond click-to-visit live) ──
function openEditPane(){
  renderEditPane();
  requestFullHeight();
  document.getElementById('edit-modal').classList.remove('hidden');
}
function closeEditPane(){
  document.getElementById('edit-modal').classList.add('hidden');
  releaseFullHeight();
  renderAll();
  if(!document.getElementById('mobile-maxi-modal').classList.contains('hidden')){
    renderMaximizedMobileTree(); // refresh without a duplicate height request
  }
}
document.getElementById('close-edit').addEventListener('click',closeEditPane);
document.getElementById('add-branch-btn').addEventListener('click',()=>{
  branches.push({id:'branch_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)});
  persist();renderEditPane();
});

// ── Backup / restore (safety net independent of localStorage/cloud sync —
// covers the case an update or a bad sync silently erases existing icons) ──
document.getElementById('export-btn').addEventListener('click',()=>{
  const data=JSON.stringify({branches,links},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='branche-backup.json';
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
});
document.getElementById('import-btn').addEventListener('click',()=>{
  document.getElementById('import-file').click();
});
document.getElementById('import-file').addEventListener('change',async(e)=>{
  const file=e.target.files[0];if(!file)return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    if(!Array.isArray(data.branches)||!Array.isArray(data.links))throw new Error('bad shape');
    branches=data.branches;links=data.links;
    migrateOrphanedLinks(); // same safety net a normal load already gets
    persist();renderAll();renderEditPane();
  }catch(err){
    alert("Couldn't read that backup file.");
  }
  e.target.value='';
});

function renderEditPane(){
  const wrap=document.getElementById('edit-branches');
  wrap.innerHTML=branches.map((branch,bi)=>{
    const branchLinks=links.filter(l=>l.branchId===branch.id);
    const rows=branchLinks.map((link,li)=>`
      <div class="leaf-edit-row" data-link-id="${link.id}">

  wrap.querySelectorAll('.branch-name-input').forEach(el=>{

// Reorders a leaf relative only to OTHER leaves on the same branch --
// finds its neighbor within that branch's own subset, then swaps their
// actual positions in the shared `links` array (which correctly changes
// their relative order within the subset regardless of other branches'
// links interleaved in between, since Array.filter preserves relative
// order of matching items).
function moveLeafWithinBranch(linkId,dir){
  const link=links.find(l=>l.id===linkId);
  if(!link)return;
  const branchLinks=links.filter(l=>l.branchId===link.branchId);
  const pos=branchLinks.indexOf(link);
  const targetPos=pos+dir;
  if(targetPos<0||targetPos>=branchLinks.length)return;
  const targetLink=branchLinks[targetPos];
  const i1=links.indexOf(link), i2=links.indexOf(targetLink);
  [links[i1],links[i2]]=[links[i2],links[i1]];
  persist();renderEditPane();
}

// ── Icon picker (nested modal, reused for both add-leaf and change-icon) ──
let iconPickCallback=null, searchDebounce=null;
function openIconPicker(onPick){
  iconPickCallback=onPick;
  document.getElementById('icon-query').value='';
  document.getElementById('icon-search-results').innerHTML='';
  document.getElementById('icon-search-status').textContent='';
  document.getElementById('icon-pick-modal').classList.remove('hidden');
  document.getElementById('icon-query').focus();
}
document.getElementById('close-icon-pick').addEventListener('click',()=>{
  document.getElementById('icon-pick-modal').classList.add('hidden');
});
document.getElementById('icon-query').addEventListener('input',e=>{
  const q=e.target.value.trim();
  clearTimeout(searchDebounce);
  if(!q){document.getElementById('icon-search-results').innerHTML='';document.getElementById('icon-search-status').textContent='';return;}
  document.getElementById('icon-search-status').textContent='Searching…';
  searchDebounce=setTimeout(()=>runIconSearch(q),350);
});
async function runIconSearch(query){
  const statusEl=document.getElementById('icon-search-status');
  const resultsEl=document.getElementById('icon-search-results');
  try{
    const res=await fetch(`https://api.iconify.design/search?query=${encodeURIComponent(query)}&limit=64`);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const icons=data.icons||[];
    if(!icons.length){resultsEl.innerHTML='';statusEl.textContent='No icons found for "'+query+'"';return;}
    statusEl.textContent='';
    resultsEl.innerHTML=icons.map(id=>`<div class="res" data-icon="${id}"><img src="${iconUrl(id,40)}" loading="lazy" alt=""></div>`).join('');
    resultsEl.querySelectorAll('.res').forEach(el=>{
      el.addEventListener('click',()=>{
        const icon=el.getAttribute('data-icon');
        document.getElementById('icon-pick-modal').classList.add('hidden');
        if(iconPickCallback)iconPickCallback(icon);
      });
    });
  }catch(err){
    resultsEl.innerHTML='';
    statusEl.textContent='Icon search unavailable right now — try again in a moment.';
  }
}

// ── Height reporting + modal full-height requests ───────────────
let lastReportedHeight=0;
let modalOpenCount=0;
function reportHeight(){
  requestAnimationFrame(()=>{
    const h=Math.ceil(document.getElementById('app').getBoundingClientRect().height);
    if(Math.abs(h-lastReportedHeight)<4)return;
    lastReportedHeight=h;
    try{window.parent.postMessage({type:'app-resize',id:'branche',height:h},window.location.origin);}catch(e){}
  });
}
function requestFullHeight(){
  modalOpenCount++;
  try{window.parent.postMessage({type:'modal-open',id:'branche'},window.location.origin);}catch(e){}
}
function releaseFullHeight(){
  modalOpenCount=Math.max(0,modalOpenCount-1);
  if(modalOpenCount>0)return; // a parent modal (e.g. the maximized mobile tree) is still open
  try{window.parent.postMessage({type:'modal-close',id:'branche'},window.location.origin);}catch(e){}
  reportHeight();
}
if(window.ResizeObserver){new ResizeObserver(reportHeight).observe(document.getElementById('app'));}

// Version bumps to the next plain number on every version of this file sent
// (switched from Roman numerals as of build 8 — project-wide convention change).
const BRANCHE_VERSION='9';
function downloadContextDoc(){
  const doc=`# Branche — Project Context (build ${BRANCHE_VERSION})

Paste this at the start of a new Claude conversation when iterating on Branche. Generated live (tiny transparent button, bottom-right corner).

## What this is

An icon-only link launcher visualized as a tree. Builds IV-VII are successive rounds of fixes made after actually seeing each previous build rendered (via the preview-file workflow — see "Working method" below). Several of these were real logic bugs, not just taste adjustments — read the sections below before assuming something is just a style choice.

- **Colors**: trunk, branches, and knot are green-family (\`--bark\`), not brown — an earlier attempt used brown and it looked bad. Leaves default to green too (\`DEFAULT_LEAF_COLOR\`); both leaf fill and icon tint stay independently editable per link.
- **Trunk and branches**: sharp rectangular edges (no border-radius at all — an earlier version rounded these, which wasn't wanted), straight lines only. Branches start exactly at the trunk's edge, not its center, so their independent \`opacity\` doesn't double-stack into a visible seam where they'd otherwise overlap. A branch's rendered length now ends exactly at its last leaf's attachment point, not extending past it with a dangling stub.
- **Leaves (build VII — the actual geometry fix)**: a plain round ellipse (\`border-radius:50%\`, not a polygon — "round" means round, not more-sided-but-still-blocky). Each leaf's baseline orientation lies flat along the SAME direction its branch extends (base and tip both effectively resting on the branch line), and the only rotation applied is a ±45° tilt of that whole leaf around its base — tip lifting toward the sky or dropping toward the ground, alternating leaf to leaf along the branch. See the dedicated section below for exactly what was wrong before and why.
- **Per-leaf color + naming**: leaf fill, icon recolor tint, and an optional name are independently editable per link; a branch can be named too. A leaf's name (or URL if unnamed) becomes its \`title\` — a hover tooltip, no permanently visible text on the tree.
- **Leaf reordering**: ▲▼ per leaf in the edit pane, scoped to just that leaf's own branch.

## The leaf-angle bug — full history, since it took multiple rounds to actually fix

**Build IV** used a leaf shape with two opposite \`border-radius\` corners at 100%, which bakes in its own diagonal before any rotation is applied — an added ±45° could land anywhere depending on which diagonal it started from. It also had leaves attached only by a single tip-point with an "above/below the branch" concept that, combined with which side of the trunk a branch was on, produced four different effective lean directions instead of one clean alternation.

**Build VI** fixed the shape's built-in diagonal (switched to an unambiguous \`clip-path\` polygon) and added the missing \`transform-origin:0 0\` (without it, rotation pivots around the element's center, not its anchor point, so the "tip" never actually stayed touching the branch) — but kept a fundamentally wrong mental model: leaves standing up roughly perpendicular from a single touch-point, rotated ±45° from *vertical*.

**Build VII** replaces that model entirely, based on an explicit correction: a leaf's baseline (unrotated) orientation is *along the branch itself* — not standing up from it — with its base anchored at the touch point and its body extending in the same direction the branch travels. The whole leaf then tilts 45° up or down *from that baseline*, alternating along the branch. Concretely: \`baselineRot\` is \`0\`° for a rightward-extending branch or \`180\`° for a leftward one (so the leaf points away from the trunk before any tilt), and the final rotation is \`baselineRot + (-45 or +45)\`, alternating by leaf index. This was verified arithmetically (not just asserted) against the actual rotation math before shipping — see the "tip offset" sanity check in this build's development notes if the angle ever needs re-deriving. Leftward and rightward branches end up on opposite alternation phases (one starts tip-up, the other starts tip-down) — this is a harmless byproduct of the trig, not a bug, since the request was for each branch to alternate cleanly along its own length, which both do.

## Canopy heading (build 9 — replaced the build 8 baobab treatment)

Verdure's requested page heading. **Build 8** tried a baobab-crown motif (sparse splayed CSS ticks flanking a "Verdure" wordmark) evoking the tree's own top; that didn't read well in practice ("looking terrible") and was replaced in build 9 with something much plainer: a single star (\`.canopy-star\`, drawn with \`clip-path\`, no SVG) with a small "V" centered inside it (\`.canopy-star-v\`). Sits directly above \`#desktop-tree\`/\`#mobile-compact\` inside \`#app\`, so it's still picked up automatically by the existing \`ResizeObserver\` on \`#app\` — no separate height-reporting wiring needed either way. Static, no JS generation required (the build 8 version needed a small \`renderCanopy()\` to build its ticks; this one doesn't).

## Branch left/right balance (build 9)

\`computeLayout()\` used to alternate each branch left/right by simple index parity (\`bi%2===0?'left':'right'\`). The trunk itself was always mathematically centered on \`centerX\`, but that alternation ignored how much each side actually weighed — an odd branch count, or one branch with far more links than another, reliably left one side visibly heavier, which read as the whole tree being off-center even though the trunk pixel wasn't. Fixed by tracking a running link-count weight per side and assigning each new branch to whichever side is currently lighter (ties still alternate by index, so the result stays fully deterministic — no measuring, no randomness, matching this file's existing convention). Only affects the desktop/centered path (\`sideMount:false\`) — mobile's side-mounted tree was never trying to be centered in the first place.

## Zero visible chrome outside the edit pane (with one exception as of build 8)

No visible button, plus sign, or label anywhere in the normal view — only the tree, its icons, hover tooltips from names, and (as of build 8, restyled in build 9) the canopy heading above. The knot at the base of the trunk is the only entry point to the edit pane, on both desktop and mobile.

## Export / Import (build 8)

Two text-link buttons in the edit pane's footer, above the Done button: **Export backup** downloads \`{branches, links}\` as \`branche-backup.json\`; **Import backup** reads a JSON file back in, validates both fields are arrays before replacing anything, runs the same \`migrateOrphanedLinks()\` safety net a normal load already gets, then persists and re-renders. Exists as a safety net independent of \`localStorage\`/cloud sync — specifically so an update that goes wrong (this has happened before, per the storage-key history below) doesn't mean re-building every icon from scratch. Same pattern Fleur and Racine already use for their own backups.

## Mobile (build VI — real redesign, not a restyle)

Earlier builds hid the tree entirely on mobile in favor of a flat list. As of build VI, mobile shows the **same tree**, just reoriented: the trunk is pinned near the left edge (\`sideMount:true\` in \`computeLayout()\`) and every branch extends rightward — alternating sides the way desktop does would run branches off the left edge of a narrow screen, so instead every branch shares the one direction that actually has room. The tree renders small by default ("minimized", \`MOBILE_MINI_SCALE\` = 0.42), and tapping anywhere on it (except an actual leaf or the knot) opens the same tree at a larger scale (0.85) in a full-height overlay ("maximized") — the knot is reachable and opens the normal edit pane from either the mini or maxi view. \`computeLayout()\` and \`renderTreeInto()\` are fully parameterized by \`{scale, sideMount}\` so desktop, mini-mobile, and maxi-mobile are three calls to the same code, not three separate implementations to keep in sync by hand.

Height-boost requests (\`requestFullHeight\`/\`releaseFullHeight\`) are now reference-counted (\`modalOpenCount\`), specifically because tapping the knot from inside the maximized mobile tree opens a second modal (the edit pane) on top of the first — without counting, closing the inner modal would have released the height request while the outer maximized-tree modal was still supposed to be full-height.

## Layout constants (tune these first if spacing/size looks off)

\`TRUNK_WIDTH\`, \`BRANCH_THICKNESS\`, \`BRANCH_V_GAP\`, \`LEAF_SPACING\`, \`LEAF_LENGTH\`/\`LEAF_WIDTH\`, \`KNOT_SIZE\`, \`KNOT_GAP_AFTER_LAST_BRANCH\`, \`EDGE_MARGIN\` (mobile side-mount margin from the screen edge) — all named constants near the top of the script. \`MOBILE_MINI_SCALE\` (0.42) and the maximized view's 0.85 scale (currently inline in \`openMaximizedMobileTree\`) control the two mobile sizes.

## Modal full-height requests

\`requestFullHeight()\`/\`releaseFullHeight()\` ask Verdure for a temporary full-viewport iframe height while any modal is open, since Branche's normal iframe height only matches its own (possibly short) content. Reference-counted as of build VI (see Mobile section above). See Verdure's own context doc for the generic \`modal-open\`/\`modal-close\` protocol.

## Data model

\`\`\`js
branches = [{id, name}]
links    = [{id, branchId, url, icon, leafColor, iconColor, name}]
\`\`\`
\`name\` is optional on both. \`leafColor\`/\`iconColor\` default to \`${DEFAULT_LEAF_COLOR}\`/\`${DEFAULT_ICON_COLOR}\` when absent. \`branche_branches\`, \`branche_links\`, \`branche_sync_endpoint\` must never be renamed.

## Cross-device sync

Unchanged since build III — push-only from a device with existing data, pull only into a genuinely empty device (no real conflict resolution; fine for one person with a few devices, not true live multi-device sync).

## Open questions

- **Geometry has been fixed twice now based on actual visual feedback (build V, build VI) and should be close**, but sizes/spacing are still worth confirming against the preview file rather than assumed correct from reading the code.
- **Mobile's maximized-view scale (0.85) is a first guess**, not yet confirmed against a real narrow screen.
- **Branch and leaf reordering both use ▲▼ buttons only**, no drag, by deliberate choice since build IV.
- **The tree metaphor itself may not be working (as of build 9)** — direct feedback was that it's "just looking terrible" and a different approach entirely might be tried next, separate from any individual geometry fix. Build 9 only did the specific fixes asked for (branch balance, canopy restyle); it did not attempt a broader redesign. If a future session is asked to "start over" on Branche's visual concept, that's a deliberate reset, not a sign every prior build's reasoning was wrong.

## Working method for future sessions

Keep this doc in sync every version. Never rename the storage keys. Branche stays fully separate from Verdure/Fleur/Racine's own files. Versioning switched from Roman numerals to plain numbers as of build 8 (project-wide convention change, alongside Racine and Verdure; Fleur keeps its own flower-name convention).
`;
