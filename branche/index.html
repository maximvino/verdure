<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- Branche — build 12 -->
<title>Branche</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#0e1c12;
  --surface:#17281a;
  --ink:#f3ead6;
  --ink2:#c3b394;
  --ink3:#8a7c62;
  --border:rgba(224,198,150,.1);
  --border2:rgba(224,198,150,.18);
  --root:#7f9767;
  --knot:#2f2013;
  --danger:#c9705a;
  --font-h:'Lora',Georgia,serif;
  --font-b:'DM Sans',sans-serif;
}
html,body{background:var(--page);color:var(--ink);font-family:var(--font-b);overflow-x:hidden}
#app{padding:20px 16px 30px;min-height:60px}

/* ── Canopy heading: the page's one heading. Was a plain star+"V" mark
   (build 9), then a French time-of-day greeting (build 10). Build 12
   adds punctuation to the greeting itself and tightens the gap before
   the icon grid specifically -- both on explicit request. ── */
#canopy{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 10px 0;user-select:none;text-align:center}
.canopy-main{font-family:var(--font-h);font-weight:500;font-size:1.3rem;color:var(--ink)}
.canopy-sub{font-family:var(--font-b);font-size:.72rem;color:var(--ink2);line-height:1.5;max-width:280px}
.canopy-sub:empty{display:none}
.canopy-sub .cs-holiday{color:var(--ink2)}
.canopy-sub .cs-bday{color:var(--root)}

/* ── Icon grid (build 12 — full replacement of the tree/branches/leaves
   concept, by explicit request: "looks awful", "totally redone").
   Deliberately minimal: a fixed-column CSS grid, bare icons, no backing
   shape/leaf/branch of any kind behind them. GRID_COLS (JS constant,
   currently 5) IS the number of columns on every screen size -- narrow
   viewports shrink the CELL size via the media query below rather than
   reflowing to fewer columns, specifically so a position in the
   underlying `icons` array always means the same grid cell everywhere,
   which is what makes the up/down/left/right move buttons in the edit
   pane (see #edit-icons below) simple, deterministic index math instead
   of something that has to account for a changing column count. ── */
#icon-grid{display:grid;grid-template-columns:repeat(var(--grid-cols),1fr);
  gap:18px 14px;max-width:520px;margin:6px auto 0;padding:4px 10px 20px;justify-items:center}
#icon-grid:empty{padding:0;margin:0} /* zero icons yet -- no speculative empty grid box */
.grid-icon{cursor:pointer;background:none;border:none;padding:4px;display:flex;align-items:center;justify-content:center;
  width:100%;aspect-ratio:1;border-radius:10px}
.grid-icon:hover{background:rgba(255,255,255,.06)}
.grid-icon img{width:60%;height:60%;object-fit:contain}
@media (max-width:480px){
  #icon-grid{gap:12px 8px;max-width:340px;padding:4px 6px 16px}
}

/* ── Knot row: the tree's trunk used to be the anchor both knots sat on;
   with no trunk anymore, they get their own small, always-present strip
   below the grid instead. Same two knots as build 11 (branches/icons
   editing, and birthdays editing, kept deliberately separate), same
   blob shape/material, just relocated. Always rendered regardless of
   whether any icons exist yet, since a knot is the ONLY entry point to
   either edit pane -- see "Zero visible chrome" in the doc. ── */
#knot-row{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 0 10px}
.knot{width:38px;height:30px;background:var(--knot);cursor:pointer;opacity:.92;border:none;padding:0;
  border-radius:46% 54% 52% 48%/55% 45% 55% 45%}
.knot:hover{filter:brightness(1.2)}
.knot-bday{width:23px;height:18px;background:var(--knot);cursor:pointer;opacity:.75;border:none;padding:0;
  border-radius:52% 48% 46% 54%/45% 55% 45% 55%}
.knot-bday:hover{filter:brightness(1.2)}

/* ── Edit pane (opened only via a knot) ── */
.modal{position:fixed;inset:0;background:rgba(10,7,3,.72);display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px}
.modal.hidden{display:none}
.modal-card{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:20px;
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.5);
  display:flex;flex-direction:column;gap:14px}
.modal-card h2{font-family:var(--font-h);font-weight:500;font-size:1.1rem}

/* ── Icon edit rows (build 12) -- one per grid icon. More controls than
   the old flat leaf-edit-row fit comfortably on one line (name, URL,
   icon picker, color, delete, AND four position-move buttons), so this
   wraps onto two lines: identity+link on top, icon/color/position/
   delete on the bottom. ── */
.icon-edit-row{border-top:1px solid var(--border);padding:8px 0;display:flex;flex-direction:column;gap:6px}
.icon-edit-row .row1{display:flex;align-items:center;gap:8px}
.icon-edit-row .row2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.icon-edit-row img{width:24px;height:24px;object-fit:contain;flex-shrink:0}
.icon-edit-row input[type=text]{width:90px;flex:none;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:6px;padding:5px 8px;font-size:.75rem;color:var(--ink);font-family:var(--font-b);outline:none}
.icon-edit-row input[type=url]{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:6px;padding:5px 8px;font-size:.75rem;color:var(--ink);font-family:var(--font-b);outline:none}
.icon-edit-row input[type=color]{width:22px;height:22px;border:none;padding:0;border-radius:50%;cursor:pointer;background:none}
.icon-edit-row input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.icon-edit-row input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
.move-pad{display:inline-grid;grid-template-columns:repeat(3,18px);grid-template-rows:repeat(2,18px);gap:2px;margin-left:auto}
.move-pad button{grid-column:auto}
.tiny-btn{background:rgba(255,255,255,.06);border:none;color:var(--ink2);border-radius:5px;
  font-size:11px;padding:3px 6px;cursor:pointer}
.tiny-btn:hover{background:rgba(255,255,255,.12)}
.tiny-btn:disabled{opacity:.25;cursor:default}
.tiny-btn:disabled:hover{background:rgba(255,255,255,.06)}
.tiny-btn.danger{color:var(--danger)}
.add-icon-btn{background:none;border:1.5px dashed var(--root);color:var(--root);
  border-radius:8px;padding:10px;font-size:.75rem;cursor:pointer;font-family:var(--font-b);width:100%;margin-top:4px}

/* ── Birthdays (build 10, own modal since build 11) ── */
.bday-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border)}
.bday-row input[type=text]{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:6px;padding:5px 8px;font-size:.78rem;color:var(--ink);font-family:var(--font-b);outline:none}
.bday-row input[type=date]{background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:6px;padding:4px 6px;font-size:.72rem;color:var(--ink);font-family:var(--font-b);outline:none;color-scheme:dark}
.add-bday-row{display:flex;gap:8px;margin-top:8px}
.add-bday-row input[type=text]{flex:1;min-width:0}

/* Export/import backup -- a safety net independent of localStorage itself,
   same pattern Fleur and Racine already use for their own data. */
.backup-row{display:flex;gap:14px;justify-content:center;padding:10px 0 2px}
.link-btn{background:none;border:none;color:var(--root);font-family:var(--font-b);
  font-size:.72rem;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:2px}
.link-btn:hover{color:var(--ink2)}
.modal-actions{display:flex;justify-content:flex-end}
.btn-done{background:none;border:1px solid var(--border2);color:var(--ink2);border-radius:20px;
  padding:6px 16px;font-family:var(--font-b);font-size:.78rem;cursor:pointer}
.btn-done:hover{background:rgba(255,255,255,.05)}

/* ── Nested icon-search modal (opened from an icon row's "icon" button) ── */
.icon-search-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;
  max-height:340px;overflow-y:auto;padding:4px}
.icon-search-results .res{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;background:rgba(255,255,255,.05)}
.icon-search-results .res:hover{background:rgba(190,220,170,.22)}
.icon-search-results .res img{width:65%;height:65%;object-fit:contain}
.icon-search-status{color:var(--ink3);font-size:.72rem;text-align:center;padding:8px 0}
.modal-card input[type=text]{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:8px;padding:9px 11px;font-size:.85rem;color:var(--ink);font-family:var(--font-b);outline:none}
.btn-primary{background:var(--root);color:var(--page);border:none;border-radius:8px;
  padding:9px 16px;font-family:var(--font-b);font-weight:600;font-size:.8rem;cursor:pointer}
.btn-primary:hover{filter:brightness(1.1)}
#doc-btn{position:fixed;bottom:0;right:0;width:14px;height:14px;border:none;background:transparent;
  cursor:pointer;z-index:9999;padding:0;opacity:0;transition:opacity .2s}
#doc-btn:hover{opacity:.3;background:radial-gradient(circle,#fff 0%,transparent 70%)}
</style>
</head>
<body>

<div id="app">
  <div id="canopy">
    <div class="canopy-main" id="canopy-main"></div>
    <div class="canopy-sub" id="canopy-sub"></div>
  </div>
  <div id="icon-grid"></div>
  <div id="knot-row">
    <button class="knot" id="main-knot" title="Edit Branche"></button>
    <button class="knot-bday" id="bday-knot" title="Edit Birthdays"></button>
  </div>
</div>
<button id="doc-btn" title="Download Branche context doc"></button>

<div class="modal hidden" id="edit-modal">
  <div class="modal-card">
    <h2>Edit Branche</h2>
    <div id="edit-icons"></div>
    <button class="add-icon-btn" id="add-icon-btn">+ Add icon</button>
    <div class="backup-row">
      <button class="link-btn" id="export-btn">Export backup</button>
      <button class="link-btn" id="import-btn">Import backup</button>
      <input type="file" id="import-file" accept="application/json" style="display:none">
    </div>
    <div class="modal-actions"><button class="btn-done" id="close-edit">Done</button></div>
  </div>
</div>

<div class="modal hidden" id="birthdays-modal">
  <div class="modal-card">
    <h2>Birthdays</h2>
    <div id="edit-birthdays"></div>
    <div class="add-bday-row">
      <input type="text" id="new-bday-name" placeholder="Name">
      <input type="date" id="new-bday-date">
      <button class="tiny-btn" id="add-bday-btn">+ Add</button>
    </div>
    <div class="modal-actions"><button class="btn-done" id="close-birthdays">Done</button></div>
  </div>
</div>

<div class="modal hidden" id="icon-pick-modal">
  <div class="modal-card">
    <h2>Choose an icon</h2>
    <input type="text" id="icon-query" placeholder="Search (e.g. youtube)">
    <div class="icon-search-status" id="icon-search-status"></div>
    <div class="icon-search-results" id="icon-search-results"></div>
    <div class="modal-actions"><button class="btn-done" id="close-icon-pick">Cancel</button></div>
  </div>
</div>

<script>
// ── Storage ──────────────────────────────────────────────────────
const ICONS_KEY='branche_icons';
const BIRTHDAYS_KEY='branche_birthdays';
const SYNC_KEY='branche_sync_endpoint';
const DEFAULT_SYNC='https://oldfleurplanner.netlify.app/api/sync';
const SYNC_ROW_ID=3;
const DEFAULT_ICON_COLOR='#f3ead6';
const GRID_COLS=5; // see #icon-grid comment in <style> for why this is fixed, not responsive

function loadIconsLocal(){try{return JSON.parse(localStorage.getItem(ICONS_KEY))||[];}catch(e){return [];}}
function saveIconsLocal(v){localStorage.setItem(ICONS_KEY,JSON.stringify(v));}
// Birthdays: [{id, name, month(1-12), day}] -- deliberately no year stored.
// The greeting only ever needs "is today someone's birthday", never an
// age -- keeping year out avoids ever having to ask "do you mean they
// turn N or N+1" for a friend who didn't give a year.
function loadBirthdaysLocal(){try{return JSON.parse(localStorage.getItem(BIRTHDAYS_KEY))||[];}catch(e){return [];}}
function saveBirthdaysLocal(v){localStorage.setItem(BIRTHDAYS_KEY,JSON.stringify(v));}
function loadSyncEndpoint(){return localStorage.getItem(SYNC_KEY)||DEFAULT_SYNC;}

// icons = [{id, url, icon, iconColor, name}] -- order in this array IS
// the grid position (row-major, GRID_COLS per row). No grouping/category
// concept anymore (that was "branches"); see the doc's Migration section
// for how an old branches+links export gets flattened into this on import.
let icons=loadIconsLocal();
let birthdays=loadBirthdaysLocal();

// ── Cross-device sync (push-only from a device with existing data;
// only a genuinely empty device pulls -- see build III notes) ──────
let cloudSyncFailed=false;
async function loadFromCloud(){
  if(icons.length||birthdays.length){saveToCloud();return false;}
  try{
    const res=await fetch(loadSyncEndpoint(),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'load',id:SYNC_ROW_ID})});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(data&&data.state&&(Array.isArray(data.state.icons)||Array.isArray(data.state.links))){
      // Array.isArray(...links) covers a cloud save from before build 12
      // (branches+links shape) landing on a fresh device -- flatten it
      // the same way importBackup() does rather than duplicating that
      // logic; see flattenOldFormat() below.
      icons=Array.isArray(data.state.icons)?data.state.icons:flattenOldFormat(data.state);
      birthdays=Array.isArray(data.state.birthdays)?data.state.birthdays:[]; // absent on pre-birthday cloud saves -- default empty, not an error
      saveIconsLocal(icons);saveBirthdaysLocal(birthdays);
      renderGrid();renderCanopy();
      return true;
    }
    return false;
  }catch(err){cloudSyncFailed=true;return false;}
}
async function saveToCloud(){
  try{
    const res=await fetch(loadSyncEndpoint(),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'save',id:SYNC_ROW_ID,state:{icons,birthdays}})});
    cloudSyncFailed=!res.ok;
  }catch(err){cloudSyncFailed=true;}
}
function persist(){saveIconsLocal(icons);saveBirthdaysLocal(birthdays);saveToCloud();}

// Flattens a pre-build-12 {branches, links} shape into a flat icons array,
// dropping branchId/leafColor (no grouping or backing-shape concept
// anymore) and preserving links' original relative order as the new grid
// order -- used by both importBackup() and the cloud-load fallback above,
// so an old export or an old cloud save both land the same way: as
// "uncategorized" icons, exactly as requested.
function flattenOldFormat(data){
  if(!Array.isArray(data.links))return [];
  return data.links.map(l=>({id:l.id,url:l.url,icon:l.icon,iconColor:l.iconColor||DEFAULT_ICON_COLOR,name:l.name||''}));
}

// ── Icon rendering ───────────────────────────────────────────────
function iconUrl(icon,size,color){
  const [prefix,name]=icon.split(':');
  const c=encodeURIComponent(color||DEFAULT_ICON_COLOR);
  return `https://api.iconify.design/${prefix}/${name}.svg?height=${size||64}&color=${c}`;
}

// ── Icon grid (live view) ─────────────────────────────────────────
function renderGrid(){
  const grid=document.getElementById('icon-grid');
  grid.style.setProperty('--grid-cols',GRID_COLS);
  grid.innerHTML=icons.map(ic=>{
    const title=ic.name?ic.name:ic.url;
    return `<button class="grid-icon" data-id="${ic.id}" title="${title}">
      <img src="${iconUrl(ic.icon,48,ic.iconColor)}" alt="" loading="lazy">
    </button>`;
  }).join('');
  grid.querySelectorAll('.grid-icon').forEach(el=>{
    el.addEventListener('click',()=>{
      const ic=icons.find(x=>x.id===el.getAttribute('data-id'));
      if(ic)window.open(ic.url,'_blank','noopener');
    });
  });
  reportHeight();
}
window.addEventListener('resize',reportHeight); // cell size changes at the 480px breakpoint; grid stays GRID_COLS columns regardless, so no re-render is needed, just a height re-check

// ── Edit pane (the ONLY place any controls beyond click-to-visit live) ──
function openEditPane(){
  renderEditPane();
  requestFullHeight();
  document.getElementById('edit-modal').classList.remove('hidden');
}
function closeEditPane(){
  document.getElementById('edit-modal').classList.add('hidden');
  releaseFullHeight();
  renderGrid();
}
document.getElementById('main-knot').addEventListener('click',openEditPane);
document.getElementById('close-edit').addEventListener('click',closeEditPane);
document.getElementById('add-icon-btn').addEventListener('click',()=>{
  openIconPicker(icon=>{
    icons.push({id:'icon_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),url:'https://',icon,iconColor:DEFAULT_ICON_COLOR,name:''});
    persist();renderEditPane();
  });
});

// ── Birthdays pane (its own knot, separate from the icons edit pane) ──
function openBirthdaysPane(){
  renderBirthdaysEditList();
  requestFullHeight();
  document.getElementById('birthdays-modal').classList.remove('hidden');
}
function closeBirthdaysPane(){
  document.getElementById('birthdays-modal').classList.add('hidden');
  releaseFullHeight();
  renderCanopy();
}
document.getElementById('bday-knot').addEventListener('click',openBirthdaysPane);
document.getElementById('close-birthdays').addEventListener('click',closeBirthdaysPane);

// ── Backup / restore (safety net independent of localStorage/cloud sync —
// covers the case an update or a bad sync silently erases existing icons) ──
document.getElementById('export-btn').addEventListener('click',()=>{
  const data=JSON.stringify({icons,birthdays},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='branche-backup.json';
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
});
document.getElementById('import-btn').addEventListener('click',()=>{
  document.getElementById('import-file').click();
});
document.getElementById('import-file').addEventListener('change',async(e)=>{
  const file=e.target.files[0];if(!file)return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    if(Array.isArray(data.icons)){
      icons=data.icons;
    }else if(Array.isArray(data.links)){
      // Pre-build-12 export (branches+links) -- flatten into flat,
      // uncategorized icons rather than rejecting the file. This is
      // exactly the path a backup made before this rewrite takes.
      icons=flattenOldFormat(data);
    }else{
      throw new Error('bad shape');
    }
    birthdays=Array.isArray(data.birthdays)?data.birthdays:[]; // older backups predate birthdays -- default empty, don't reject the whole file over it
    persist();renderGrid();renderEditPane();renderCanopy();
  }catch(err){
    alert("Couldn't read that backup file.");
  }
  e.target.value='';
});

// ── Birthdays edit list ──────────────────────────────────────────
function renderBirthdaysEditList(){
  const wrap=document.getElementById('edit-birthdays');
  if(!wrap)return;
  const sorted=birthdays.slice().sort((a,b)=>(a.month-b.month)||(a.day-b.day));
  wrap.innerHTML=sorted.map(b=>{
    const mm=String(b.month).padStart(2,'0'),dd=String(b.day).padStart(2,'0');
    // <input type=date> needs a full date to display anything -- year is
    // thrown away again the moment it's re-saved (see BIRTHDAYS_KEY note).
    return `
    <div class="bday-row" data-id="${b.id}">
      <input type="text" data-action="bday-name" data-id="${b.id}" value="${(b.name||'').replace(/"/g,'&quot;')}" placeholder="Name">
      <input type="date" data-action="bday-date" data-id="${b.id}" value="2000-${mm}-${dd}">
      <button class="tiny-btn danger" data-action="bday-del" data-id="${b.id}">✕</button>
    </div>`;
  }).join('')||'<div style="font-size:.72rem;color:var(--ink3);padding:4px 0">No birthdays added yet</div>';
  wrap.querySelectorAll('[data-action=bday-name]').forEach(el=>{
    el.addEventListener('input',()=>{
      const b=birthdays.find(x=>x.id===el.dataset.id);if(!b)return;
      b.name=el.value;persist();renderCanopy();
    });
  });
  wrap.querySelectorAll('[data-action=bday-date]').forEach(el=>{
    el.addEventListener('change',()=>{
      const b=birthdays.find(x=>x.id===el.dataset.id);if(!b||!el.value)return;
      const [,m,d]=el.value.split('-').map(Number); // year deliberately discarded
      b.month=m;b.day=d;persist();renderBirthdaysEditList();renderCanopy();
    });
  });
  wrap.querySelectorAll('[data-action=bday-del]').forEach(el=>{
    el.addEventListener('click',()=>{
      birthdays=birthdays.filter(x=>x.id!==el.dataset.id);
      persist();renderBirthdaysEditList();renderCanopy();
    });
  });
}
document.getElementById('add-bday-btn').addEventListener('click',()=>{
  const nameEl=document.getElementById('new-bday-name');
  const dateEl=document.getElementById('new-bday-date');
  if(!dateEl.value)return; // name alone with no date isn't useful -- require a date
  const [,m,d]=dateEl.value.split('-').map(Number);
  birthdays.push({id:'bday_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    name:nameEl.value.trim()||'(no name)',month:m,day:d});
  nameEl.value='';dateEl.value='';
  persist();renderBirthdaysEditList();renderCanopy();
});

// ── Icons edit list ────────────────────────────────────────────────
// Position controls: four buttons (left/right/up/down) per icon, each a
// plain array-index swap against the neighbor in that direction --
// left/right are ±1, up/down are ±GRID_COLS (see the #icon-grid comment
// in <style> for why GRID_COLS is a fixed constant rather than something
// derived from the viewport). Disabled/omitted at the array's edges
// rather than wrapping around, same "no surprises" spirit as the old
// branch/leaf ▲▼ reordering this replaces.
function moveIcon(id,delta){
  const i=icons.findIndex(x=>x.id===id);
  const t=i+delta;
  if(i<0||t<0||t>=icons.length)return;
  [icons[i],icons[t]]=[icons[t],icons[i]];
  persist();renderEditPane();renderGrid();
}

function renderEditPane(){
  const wrap=document.getElementById('edit-icons');
  wrap.innerHTML=icons.map((ic,i)=>{
    const row=Math.floor(i/GRID_COLS), col=i%GRID_COLS;
    const canLeft=col>0, canRight=col<GRID_COLS-1&&i<icons.length-1,
          canUp=i-GRID_COLS>=0, canDown=i+GRID_COLS<icons.length;
    return `
    <div class="icon-edit-row" data-id="${ic.id}">
      <div class="row1">

let iconPickCallback=null, searchDebounce=null;
function openIconPicker(onPick){
  iconPickCallback=onPick;
  document.getElementById('icon-query').value='';
  document.getElementById('icon-search-results').innerHTML='';
  document.getElementById('icon-search-status').textContent='';
  document.getElementById('icon-pick-modal').classList.remove('hidden');
  document.getElementById('icon-query').focus();
}
document.getElementById('close-icon-pick').addEventListener('click',()=>{
  document.getElementById('icon-pick-modal').classList.add('hidden');
});
document.getElementById('icon-query').addEventListener('input',e=>{
  const q=e.target.value.trim();
  clearTimeout(searchDebounce);
  if(!q){document.getElementById('icon-search-results').innerHTML='';document.getElementById('icon-search-status').textContent='';return;}
  document.getElementById('icon-search-status').textContent='Searching…';
  searchDebounce=setTimeout(()=>runIconSearch(q),350);
});
async function runIconSearch(query){
  const statusEl=document.getElementById('icon-search-status');
  const resultsEl=document.getElementById('icon-search-results');
  try{
    const res=await fetch(`https://api.iconify.design/search?query=${encodeURIComponent(query)}&limit=64`);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const iconsFound=data.icons||[];
    if(!iconsFound.length){resultsEl.innerHTML='';statusEl.textContent='No icons found for "'+query+'"';return;}
    statusEl.textContent='';
    resultsEl.innerHTML=iconsFound.map(id=>`<div class="res" data-icon="${id}"><img src="${iconUrl(id,40)}" loading="lazy" alt=""></div>`).join('');
    resultsEl.querySelectorAll('.res').forEach(el=>{
      el.addEventListener('click',()=>{
        const icon=el.getAttribute('data-icon');
        document.getElementById('icon-pick-modal').classList.add('hidden');
        if(iconPickCallback)iconPickCallback(icon);
      });
    });
  }catch(err){
    resultsEl.innerHTML='';
    statusEl.textContent='Icon search unavailable right now — try again in a moment.';
  }
}

// ── Canopy greeting (build 10; punctuation added build 12) ────────
// Main line: a French greeting that changes with the time of day.
// Sub line (smaller, under it): any holiday recognized today (American,
// Canadian, Québécois, or Jewish), plus any friend's birthday that's
// today. Purely client-side, no network call -- Jewish holidays
// especially need one since their Gregorian dates shift every year
// (lunisolar calendar); see JEWISH_HOLIDAYS below for exactly how far
// that table currently reaches and how to extend it.

function timeGreeting(d){
  // Non-breaking space (\u00A0) before "!" is correct French typography
  // (French inserts a space before ! ? ; :, traditionally a thin one;
  // \u00A0 is the closest a plain string can get without extra markup) --
  // added in build 12 on explicit request for punctuation here.
  const h=d.getHours();
  if(h>=5&&h<12)return 'Bonjour\u00A0!';
  if(h>=12&&h<18)return 'Bon après-midi\u00A0!';
  if(h>=18&&h<22)return 'Bonsoir\u00A0!';
  return 'Bonne nuit\u00A0!';
}

// ── Date-rule helpers for floating (nth-weekday) holidays ─────────
function nthWeekdayOfMonth(year,month,weekday,n){ // month 0-indexed, weekday 0=Sun..6=Sat
  const d=new Date(year,month,1);
  let count=0;
  while(d.getMonth()===month){
    if(d.getDay()===weekday){count++;if(count===n)return new Date(d);}
    d.setDate(d.getDate()+1);
  }
  return null;
}
function lastWeekdayOfMonth(year,month,weekday){
  const d=new Date(year,month+1,0); // last calendar day of month
  while(d.getDay()!==weekday)d.setDate(d.getDate()-1);
  return d;
}
function sameDate(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}

// ── Floating (nth-weekday-of-month) holidays, computed per year ────
function floatingHolidaysForYear(year){
  const out=[];
  const push=(date,name,greeting,solemn)=>{if(date)out.push({date,name,greeting:greeting||null,solemn:!!solemn});};
  push(nthWeekdayOfMonth(year,0,1,3),'Martin Luther King Jr. Day',null,true);           // Jan, 3rd Mon
  const febThirdMon=nthWeekdayOfMonth(year,1,1,3);                                       // Feb, 3rd Mon
  push(febThirdMon,"le Presidents' Day",null,true);            // US -- informational only
  push(febThirdMon,'la fête de la Famille','Bonne fête de la Famille !'); // CA (not observed in Québec)
  const lastMonMay=lastWeekdayOfMonth(year,4,1);                                         // last Monday of May
  push(lastMonMay,'le Memorial Day',null,true);                 // US -- solemn
  push(lastMonMay,'la fête de Victoria','Bonne fête de Victoria !'); // CA (excl. Québec)
  push(lastMonMay,'la Journée nationale des patriotes','Bonne Journée des Patriotes !'); // Québec's own name for the same date
  push(nthWeekdayOfMonth(year,8,1,1),'la fête du Travail','Bonne fête du Travail !');   // Sept, 1st Mon -- shared US/CA/QC date
  const octSecondMon=nthWeekdayOfMonth(year,9,1,2);                                      // Oct, 2nd Mon
  push(octSecondMon,"l'Action de grâce",'Joyeux Action de grâce !'); // Canada/Québec Thanksgiving
  push(octSecondMon,'le Columbus Day',null,true);                // US -- informational only, contested naming, no invented greeting
  push(nthWeekdayOfMonth(year,10,4,4),'le Thanksgiving',"Bon Thanksgiving !"); // Nov, 4th Thu -- US Thanksgiving
  return out;
}

function todaysHolidays(now){
  const y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate();
  const hits=[];
  FIXED_HOLIDAYS.forEach(h=>{if(h.month===m&&h.day===d)hits.push(h);});
  floatingHolidaysForYear(y).forEach(h=>{if(sameDate(h.date,now))hits.push(h);});
  // A floating US/CA date can land on Dec 31/Jan 1 boundary in neither
  // direction here, so no year-wraparound check is needed for those --
  // but Jewish ranges do cross Gregorian year/month boundaries (e.g.
  // Hanoucca 2027-28), so compare against actual Date objects, not
  // separate y/m/d fields, to get inclusive ranges right either way.
  const todayDate=new Date(y,m-1,d);
  JEWISH_HOLIDAYS.forEach(h=>{
    const start=new Date(h.y,h.m-1,h.d),end=new Date(h.y2,h.m2-1,h.d2);
    if(todayDate>=start&&todayDate<=end)hits.push(h);
  });
  return hits;
}

function birthdaysToday(now){
  const m=now.getMonth()+1,d=now.getDate();
  return birthdays.filter(b=>b.month===m&&b.day===d);
}

function renderCanopy(){
  const now=new Date();
  const mainEl=document.getElementById('canopy-main');
  const subEl=document.getElementById('canopy-sub');
  if(!mainEl||!subEl)return;
  mainEl.textContent=timeGreeting(now);

  const lines=[];
  const holidays=todaysHolidays(now);
  if(holidays.length){
    lines.push(`<div class="cs-holiday">${holidays.map(h=>h.solemn?h.name:(h.greeting||h.name)).join(' · ')}</div>`);
  }
  const todayBdays=birthdaysToday(now);
  if(todayBdays.length){
    lines.push(`<div class="cs-bday">${todayBdays.map(b=>`Bon anniversaire ${b.name} !`).join(' · ')}</div>`);
  }
  subEl.innerHTML=lines.join('');
  reportHeight();
}

  });
}
function requestFullHeight(){

  modalOpenCount=Math.max(0,modalOpenCount-1);

  try{window.parent.postMessage({type:'modal-close',id:'branche'},window.location.origin);}catch(e){}
  reportHeight();
}

## What this is

A personal icon launcher: a flat grid of icons, each linking out to a site or tool, arranged by hand in the edit pane. Also carries Verdure's page heading (a French time-of-day greeting recognizing American/Canadian/Québécois/Jewish holidays and friends' birthdays) and its own birthday list, both unrelated to the icon grid itself but living in this file per Verdure's own doc.

## Total redesign (build 12) — tree/branches/leaves are gone

Builds I through 11 used a hand-drawn tree metaphor: a trunk, branches alternating left/right, leaf-shaped icon holders tilting off each branch. **This was explicitly scrapped** ("looks awful", "totally redone") in favor of a plain, flat, fixed-column icon grid (\`#icon-grid\`, \`GRID_COLS=5\`) — bare icons with **no backing shape of any kind** behind them (no leaf, no branch, no trunk), positioned by hand via move buttons in the edit pane rather than any organic/computed layout. This removed a large amount of code and an entire mobile-specific subsystem along with it:

- \`computeLayout()\`, \`renderTreeInto()\`, the left/right branch-balancing logic, and every tree-shape CSS class are gone.
- The old mobile "minimized tree, tap to enlarge into a full-height overlay" system (\`renderMobileTree\`, \`openMaximizedMobileTree\`, \`renderMaximizedMobileTree\`, \`#mobile-maxi-modal\`) is gone entirely — a fixed-column CSS grid doesn't need a separate mobile layout pass the way a hand-computed tree did. Mobile just gets smaller grid cells via a \`480px\` media query; same \`GRID_COLS\`, same array-index math, same everything else. This is a meaningful simplification, not just a visual swap.
- **Categories ("branches") are gone.** The grid is flat — every icon is a peer, there's no grouping concept anymore. An old branches+links export/cloud-save still imports correctly (see Migration below), just flattened into one uncategorized list.

## Icon grid mechanics

\`icons = [{id, url, icon, iconColor, name}]\` — a **flat array**, order-is-position: index \`i\` sits at grid row \`floor(i/GRID_COLS)\`, column \`i%GRID_COLS\`. \`GRID_COLS\` (currently 5) is a **fixed constant, not derived from viewport width** — narrow screens shrink the grid's cell size via a media query instead of reflowing to fewer columns, specifically so a given array index always lands in the same conceptual cell everywhere. That's what keeps the edit pane's move-buttons simple: left/right are \`±1\`, up/down are \`±GRID_COLS\`, plain array-swaps, no coordinate system or collision-detection needed anywhere.

**No live drag-and-drop** — deliberate, matching this file's existing convention (branches/leaves reordering was always button-based too, "no drag, by deliberate choice since build IV"). Each icon's edit row has a small 4-button move-pad (▲◀▼▶); a button is disabled rather than wrapping around when there's nowhere to go in that direction (matches the array's actual edges, not a fixed row/col boundary, so the disabled state is always accurate even on a partially-filled last row).

**Zero visible chrome outside the edit panes.** No visible plus sign, label, or border around the grid itself — just bare icons on the page background, click-to-visit. \`#icon-grid:empty\` collapses to zero size when there are no icons yet, so an unconfigured install shows nothing but the greeting and the two knots (see below) — same "no speculative UI" principle the old tree followed.

## Two knots, relocated (not redesigned)

Build 11 added a second, smaller knot for birthdays, positioned next to the main knot on the trunk. **There's no trunk anymore**, so build 12 gives both knots their own small, always-present strip below the grid (\`#knot-row\`) instead — same shapes, same colors, same separate-modals behavior (\`openEditPane\`/\`openBirthdaysPane\`), just relocated rather than redesigned. They're real \`<button>\` elements now rather than absolutely-positioned \`<div>\`s (there's no layout-engine coordinate math driving their position anymore, so plain flow layout is simpler and equally reliable).

## Migration from the old branches+links format

\`flattenOldFormat(data)\` takes a pre-build-12 \`{branches, links}\` shape and produces a flat \`icons\` array: each link's \`id\`/\`url\`/\`icon\`/\`iconColor\`/\`name\` carry over directly, \`branchId\` and \`leafColor\` are dropped (no grouping or backing-shape concept survives), and the original links' relative order becomes the new grid order — so an old export lands as one flat, "uncategorized" list, in the same relative order the icons used to appear in across all the old branches. This runs in two places: **Import backup** (an old \`branche-backup.json\`) and the **cloud-load fallback** (a device that pulls down a pre-build-12 cloud save). Both funnel through the same \`flattenOldFormat()\` rather than duplicating the mapping logic.

## Canopy heading — punctuation and spacing (build 12)

Two small, explicitly requested tweaks to the greeting itself (unrelated to the grid rewrite, but shipped in the same build): \`timeGreeting()\`'s four return values now end in \`\\u00A0!\` (a non-breaking space before the exclamation mark, correct French typography — French inserts a space before \`! ? ; :\`) instead of no punctuation at all; and \`#canopy\`'s bottom padding was cut and \`#icon-grid\` given a small explicit \`margin-top\` instead, so the gap between the greeting and the first row of icons is deliberately tighter than default block spacing would give it.

## Icon color

Each icon keeps its own \`iconColor\` (a color picker in its edit row, same UI pattern as before) — tints the icon glyph itself via Iconify's \`?color=\` query param (\`iconUrl()\`). There is no second, backing-shape color anymore (the old \`leafColor\` is gone along with the leaf shape it used to fill) — "icons can still have their color changed" now means exactly one color knob per icon, not two.

## Everything else (birthdays, greeting/holiday recognition, sync, height-reporting) is unchanged from build 11

See builds 10-11 history below for how those work — none of that logic depends on the tree/grid markup, so the rewrite didn't touch it beyond the punctuation/spacing tweak above.

## Birthdays (build 10, own knot/modal since build 11)

If today is a friend's birthday, "Bon anniversaire \\<name\\> !" shows in the canopy subtext, in French (matching the rest of the greeting/subtext area). Nothing shows on any other day — no advance "N days away" reminder (removed in build 11, wasn't asked for), no emoji (also removed in build 11). Stored as \`birthdays = [{id, name, month, day}]\`, deliberately no year — the greeting only ever needs "is it today," never an age. Editing lives in its own modal (\`#birthdays-modal\`, opened by \`#bday-knot\`), and that editing UI is English — only the *displayed* greeting/subtext is French, since that's specifically what was asked for.

## Holiday recognition

Three separate lists by how their dates are determined:
- Fixed calendar dates (New Year's, Canada Day, St-Jean, July 4th, Christmas, etc.) — a flat month/day list (\`FIXED_HOLIDAYS\`).
- Floating "nth weekday of month" dates (MLK Day, Family Day/Presidents' Day, Victoria Day/Journée des patriotes/Memorial Day, Labour Day, the two different Thanksgivings, Columbus Day) — computed per-year via \`nthWeekdayOfMonth()\`/\`lastWeekdayOfMonth()\` (\`floatingHolidaysForYear()\`), not hardcoded, since these shift every year by design.
- Jewish holidays (\`JEWISH_HOLIDAYS\`) — a **hardcoded lookup table**, deliberately NOT computed live (their Gregorian dates shift every year because the Hebrew calendar is lunisolar). Sourced from the URJ's published 5786–5790 holiday calendar (Gregorian Sept 2025 through ~June 2030). **This table currently only reaches Spring 2030** — there's a comment directly above \`JEWISH_HOLIDAYS\` explaining exactly how to extend it.

Not every recognized day gets an exclamatory greeting: Yom Kippur, Tisha B'Av, Remembrance/Veterans Day, Memorial Day, MLK Day, Presidents' Day, and Columbus Day are all marked \`solemn:true\` and shown by name only.

## Cross-device sync

Unchanged mechanism since build III — push-only from a device with existing data, pull only into a genuinely empty device (no real conflict resolution; fine for one person with a few devices, not true live multi-device sync). As of build 12, the synced state carries \`{icons, birthdays}\` instead of \`{branches, links, birthdays}\` — no change to \`sync.js\` was needed, since it already stores/returns an opaque \`state\` object per row rather than caring about its shape. A device pulling down a pre-build-12 cloud save gets it flattened via \`flattenOldFormat()\` automatically (see Migration above) rather than erroring.

## Open questions

- **\`GRID_COLS=5\` is a first guess**, not confirmed against how many icons actually get used day to day — easy to tune (one constant) if it turns out too cramped or too sparse.
- **\`JEWISH_HOLIDAYS\` only reaches Spring 2030** — extend it before then; see the comment directly above that table for how.
- **Cross-device sync (icons+birthdays) hasn't been confirmed against the real deployed \`sync.js\`/Supabase endpoint** from this sandbox (no network egress to it here) — the request shape is unchanged from build 11's already-working version, just a different \`state\` payload, so risk is low but unverified end-to-end.
