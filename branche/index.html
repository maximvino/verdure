<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- Branche — build 13 -->
<title>Branche</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#0e1c12;
  --surface:#17281a;
  --ink:#f3ead6;
  --ink2:#c3b394;
  --ink3:#8a7c62;
  --border:rgba(224,198,150,.1);
  --border2:rgba(224,198,150,.18);
  --root:#7f9767;
  --knot:#2f2013;
  --danger:#c9705a;
  --font-h:'Lora',Georgia,serif;
  --font-b:'DM Sans',sans-serif;
}
html,body{background:var(--page);color:var(--ink);font-family:var(--font-b);overflow-x:hidden}
#app{position:relative;padding:20px 16px 30px;min-height:60px}

/* ── Canopy heading ── */
#canopy{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 10px 0;user-select:none;text-align:center}
.canopy-main{font-family:var(--font-h);font-weight:500;font-size:1.3rem;color:var(--ink)}
.canopy-sub{font-family:var(--font-b);font-size:.72rem;color:var(--ink2);line-height:1.5;max-width:280px}
.canopy-sub:empty{display:none}
.canopy-sub .cs-holiday{color:var(--ink2)}
.canopy-sub .cs-bday{color:var(--root)}

/* ── Icon grid (build 12/13) -- bare icons, no backing shape, explicit
   {col,row} placement now (build 13) rather than flat array order, so
   the person can put an icon anywhere in the grid, not just next in
   sequence. gridCols/gridRows are user-editable state (see edit pane),
   not fixed constants anymore. ── */
#icon-grid-wrap{max-width:560px;margin:6px auto 0}
#icon-grid{display:grid;gap:18px 14px;padding:4px 10px 20px;justify-items:center}
#icon-grid:empty{padding:0;margin:0}
.grid-icon{cursor:pointer;background:none;border:none;padding:4px;display:flex;align-items:center;justify-content:center;
  width:100%;aspect-ratio:1;border-radius:10px}
.grid-icon:hover{background:rgba(255,255,255,.06)}
.grid-icon img{width:60%;height:60%;object-fit:contain}

/* ── Mobile: collapsed by default (build 13) -- a small tap-to-expand
   summary instead of the full grid, since a multi-row grid at full size
   is a lot of vertical space to always show on a phone. Same GRID_COLS/
   GRID_ROWS and same icons either way -- this only toggles visibility,
   nothing about layout or data changes on mobile. ── */
#grid-toggle{display:none;width:100%;max-width:340px;margin:6px auto 0;background:rgba(255,255,255,.05);
  border:1px solid var(--border2);border-radius:10px;padding:10px;color:var(--ink2);font-family:var(--font-b);
  font-size:.8rem;cursor:pointer;text-align:center}
@media (max-width:480px){
  #grid-toggle{display:block}
  #icon-grid-wrap{display:none}
  #icon-grid-wrap.expanded{display:block;max-width:340px}
  #icon-grid.expanded-grid{gap:12px 8px;padding:4px 6px 16px}
}

/* ── Knots → small corner buttons (build 13) -- there's no trunk to sit
   on anymore (hasn't been since build 12), and the organic knot-blob
   shape stopped making sense once it wasn't attached to bark. Plain
   small buttons, tucked in the bottom-right of Branche's own content
   area (not the page/viewport corner -- that's where the invisible
   context-doc button already lives, see #doc-btn). ── */
#corner-buttons{position:absolute;bottom:6px;right:10px;display:flex;gap:6px}
.corner-btn{background:rgba(255,255,255,.06);border:1px solid var(--border2);color:var(--ink2);
  border-radius:6px;padding:5px 10px;font-family:var(--font-b);font-size:.68rem;cursor:pointer}
.corner-btn:hover{background:rgba(255,255,255,.12);color:var(--ink)}

/* ── Edit pane ── */
.modal{position:fixed;inset:0;background:rgba(10,7,3,.72);display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px}
.modal.hidden{display:none}
.modal-card{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:20px;
  width:100%;max-width:680px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.5);
  display:flex;flex-direction:column;gap:14px}
.modal-card h2{font-family:var(--font-h);font-weight:500;font-size:1.1rem}

/* Grid-dimensions control, top of the edit pane */
.grid-dims-row{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--border2)}
.grid-dims-row label{font-size:.78rem;color:var(--ink2)}
.grid-dims-row input{width:70px;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:6px;padding:6px 8px;font-size:.85rem;color:var(--ink);font-family:var(--font-b);outline:none;text-align:center}
.grid-dims-err{color:var(--danger);font-size:.72rem}

/* ── Icon edit rows (build 13 -- redesigned: was 4 move-buttons + delete
   + icon + color all crammed on one line, replaced with a single
   position field ("A1") plus an inline error message when it's invalid
   or already taken. Fewer, wider controls than build 12's row. ── */
.icon-edit-row{border-top:1px solid var(--border);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.icon-edit-row .row1{display:flex;align-items:center;gap:8px}
.icon-edit-row .row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.icon-edit-row img{width:26px;height:26px;object-fit:contain;flex-shrink:0}
.icon-edit-row input[type=text]{background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:6px;padding:6px 9px;font-size:.8rem;color:var(--ink);font-family:var(--font-b);outline:none}
.icon-edit-row input.name-field{width:110px;flex:none}
.icon-edit-row input[type=url]{flex:1;min-width:120px;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:6px;padding:6px 9px;font-size:.8rem;color:var(--ink);font-family:var(--font-b);outline:none}
.icon-edit-row input.pos-field{width:52px;flex:none;text-align:center;text-transform:uppercase}
.icon-edit-row input.pos-field.err{border-color:var(--danger)}
.icon-edit-row input[type=color]{width:24px;height:24px;border:none;padding:0;border-radius:50%;cursor:pointer;background:none;flex-shrink:0}
.icon-edit-row input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.icon-edit-row input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
.pos-err-msg{color:var(--danger);font-size:.7rem;width:100%}
.tiny-btn{background:rgba(255,255,255,.06);border:none;color:var(--ink2);border-radius:5px;
  font-size:11px;padding:4px 8px;cursor:pointer}
.tiny-btn:hover{background:rgba(255,255,255,.12)}
.tiny-btn.danger{color:var(--danger)}
.add-icon-btn{background:none;border:1.5px dashed var(--root);color:var(--root);
  border-radius:8px;padding:10px;font-size:.75rem;cursor:pointer;font-family:var(--font-b);width:100%;margin-top:4px}

/* ── Birthdays ── */
.bday-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border)}
.bday-row input[type=text]{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:6px;padding:5px 8px;font-size:.78rem;color:var(--ink);font-family:var(--font-b);outline:none}
.bday-row input[type=date]{background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:6px;padding:4px 6px;font-size:.72rem;color:var(--ink);font-family:var(--font-b);outline:none;color-scheme:dark}
.add-bday-row{display:flex;gap:8px;margin-top:8px}
.add-bday-row input[type=text]{flex:1;min-width:0}

.backup-row{display:flex;gap:14px;justify-content:center;padding:10px 0 2px}
.link-btn{background:none;border:none;color:var(--root);font-family:var(--font-b);
  font-size:.72rem;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:2px}
.link-btn:hover{color:var(--ink2)}
.modal-actions{display:flex;justify-content:flex-end}
.btn-done{background:none;border:1px solid var(--border2);color:var(--ink2);border-radius:20px;
  padding:6px 16px;font-family:var(--font-b);font-size:.78rem;cursor:pointer}
.btn-done:hover{background:rgba(255,255,255,.05)}

.icon-search-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;
  max-height:340px;overflow-y:auto;padding:4px}
.icon-search-results .res{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;background:rgba(255,255,255,.05)}
.icon-search-results .res:hover{background:rgba(190,220,170,.22)}
.icon-search-results .res img{width:65%;height:65%;object-fit:contain}
.icon-search-status{color:var(--ink3);font-size:.72rem;text-align:center;padding:8px 0}
.modal-card input[type=text].search-input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:8px;padding:9px 11px;font-size:.85rem;color:var(--ink);font-family:var(--font-b);outline:none}
#doc-btn{position:fixed;bottom:0;right:0;width:14px;height:14px;border:none;background:transparent;
  cursor:pointer;z-index:9999;padding:0;opacity:0;transition:opacity .2s}
#doc-btn:hover{opacity:.3;background:radial-gradient(circle,#fff 0%,transparent 70%)}
</style>
</head>
<body>

<div id="app">
  <div id="canopy">
    <div class="canopy-main" id="canopy-main"></div>
    <div class="canopy-sub" id="canopy-sub"></div>
  </div>
  <button id="grid-toggle"></button>
  <div id="icon-grid-wrap"><div id="icon-grid"></div></div>
  <div id="corner-buttons">
    <button class="corner-btn" id="main-knot">Edit</button>
    <button class="corner-btn" id="bday-knot">Bdays</button>
  </div>
</div>
<button id="doc-btn" title="Download Branche context doc"></button>

<div class="modal hidden" id="edit-modal">
  <div class="modal-card">
    <h2>Edit Branche</h2>
    <div class="grid-dims-row">
      <label for="grid-dims-input">Grid size (columns x rows)</label>
      <input type="text" id="grid-dims-input" placeholder="5x4">
      <span class="grid-dims-err" id="grid-dims-err"></span>
    </div>
    <div id="edit-icons"></div>
    <button class="add-icon-btn" id="add-icon-btn">+ Add icon</button>
    <div class="backup-row">
      <button class="link-btn" id="export-btn">Export backup</button>
      <button class="link-btn" id="import-btn">Import backup</button>
      <input type="file" id="import-file" accept="application/json" style="display:none">
    </div>
    <div class="modal-actions"><button class="btn-done" id="close-edit">Done</button></div>
  </div>
</div>

<div class="modal hidden" id="birthdays-modal">
  <div class="modal-card">
    <h2>Birthdays</h2>
    <div id="edit-birthdays"></div>
    <div class="add-bday-row">
      <input type="text" id="new-bday-name" placeholder="Name">
      <input type="date" id="new-bday-date">
      <button class="tiny-btn" id="add-bday-btn">+ Add</button>
    </div>
    <div class="modal-actions"><button class="btn-done" id="close-birthdays">Done</button></div>
  </div>
</div>

<div class="modal hidden" id="icon-pick-modal">
  <div class="modal-card">
    <h2>Choose an icon</h2>
    <input type="text" class="search-input" id="icon-query" placeholder="Search (e.g. youtube)">
    <div class="icon-search-status" id="icon-search-status"></div>
    <div class="icon-search-results" id="icon-search-results"></div>
    <div class="modal-actions"><button class="btn-done" id="close-icon-pick">Cancel</button></div>
  </div>
</div>

<script>
// ── Storage ──────────────────────────────────────────────────────
const ICONS_KEY='branche_icons';
const GRID_DIMS_KEY='branche_grid_dims';
const UPDATED_AT_KEY='branche_updated_at';
const BIRTHDAYS_KEY='branche_birthdays';
const SYNC_KEY='branche_sync_endpoint';
const DEFAULT_SYNC='https://oldfleurplanner.netlify.app/api/sync';
const SYNC_ROW_ID=3;
const DEFAULT_ICON_COLOR='#f3ead6';
const DEFAULT_GRID_COLS=5, DEFAULT_GRID_ROWS=4;
const MAX_GRID_COLS=26; // single-letter column labels only (A-Z) -- see coordLabel()

function loadIconsLocal(){try{return JSON.parse(localStorage.getItem(ICONS_KEY))||[];}catch(e){return [];}}
function saveIconsLocal(v){localStorage.setItem(ICONS_KEY,JSON.stringify(v));}
function loadGridDimsLocal(){
  try{
    const d=JSON.parse(localStorage.getItem(GRID_DIMS_KEY));
    if(d&&Number.isInteger(d.cols)&&Number.isInteger(d.rows))return d;
  }catch(e){}
  return {cols:DEFAULT_GRID_COLS,rows:DEFAULT_GRID_ROWS};
}
function saveGridDimsLocal(){localStorage.setItem(GRID_DIMS_KEY,JSON.stringify({cols:gridCols,rows:gridRows}));}
function loadUpdatedAtLocal(){return parseInt(localStorage.getItem(UPDATED_AT_KEY)||'0',10);}
function saveUpdatedAtLocal(v){localStorage.setItem(UPDATED_AT_KEY,String(v));}
function loadBirthdaysLocal(){try{return JSON.parse(localStorage.getItem(BIRTHDAYS_KEY))||[];}catch(e){return [];}}
function saveBirthdaysLocal(v){localStorage.setItem(BIRTHDAYS_KEY,JSON.stringify(v));}
function loadSyncEndpoint(){return localStorage.getItem(SYNC_KEY)||DEFAULT_SYNC;}

// icons = [{id, url, icon, iconColor, name, col, row}] -- col/row are
// explicit 0-indexed grid coordinates (build 13; was flat-array order in
// build 12). gridCols/gridRows are now user-editable state, not a fixed
// constant -- see "Grid size" control in the edit pane.
let icons=loadIconsLocal();
const _dims=loadGridDimsLocal();
let gridCols=_dims.cols, gridRows=_dims.rows;
let birthdays=loadBirthdaysLocal();
let localUpdatedAt=loadUpdatedAtLocal();

// ── Cross-device sync (build 13 rewrite — see doc for why) ─────────
// Build 12's loadFromCloud() only ever pulled from the cloud into a
// device with NO existing data (`if(icons.length||birthdays.length)
// {saveToCloud();return false;}`), and pushed otherwise. That meant any
// device that already had icons -- which, after the very first use, is
// every device -- never looked at the cloud again; it only ever
// overwrote it. Two devices that both had data could drift forever,
// each clobbering the other's changes on its own next save, which is
// exactly the "changes don't always show up on the other computer"
// symptom this was built to fix. Replaced with real (if simple)
// last-write-wins reconciliation: every save stamps `updatedAt`
// (Date.now()), and loadFromCloud() ALWAYS fetches the remote state and
// compares timestamps, adopting whichever side is actually newer,
// regardless of which device has data already.
//
// This is still not true multi-device merge (a genuine simultaneous
// edit on two devices before either syncs will have one side's changes
// lost, not merged) -- for one person's own icons/birthdays across a
// couple of their own devices, last-write-wins is the standard,
// reasonable tradeoff; it just needs to actually run on every load,
// which it now does, plus periodically and whenever the tab regains
// focus (see setInterval/visibilitychange below), so a device left open
// picks up another device's changes without needing a manual reload.
let cloudSyncFailed=false;
async function loadFromCloud(){
  try{
    const res=await fetch(loadSyncEndpoint(),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'load',id:SYNC_ROW_ID})});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data||!data.state){
      // No cloud row yet at all -- push local up if there's anything to push.
      if(icons.length||birthdays.length)saveToCloud();
      return false;
    }
    const remoteUpdatedAt=data.state.updatedAt||0; // 0 covers a pre-build-13 cloud save with no timestamp -- local always wins against that, which is fine, it's stale by definition
    if(remoteUpdatedAt>localUpdatedAt){
      // Array.isArray(...links) covers a genuinely old (pre-build-12)
      // branches+links cloud save; Array.isArray(...icons) with no
      // col/row on its entries covers a build-12 cloud save (flat order,
      // no coordinates yet) -- both get normalized the same way an
      // import would, via normalizeIncomingIcons().
      icons=normalizeIncomingIcons(data.state);
      birthdays=Array.isArray(data.state.birthdays)?data.state.birthdays:[];
      gridCols=Number.isInteger(data.state.gridCols)?data.state.gridCols:DEFAULT_GRID_COLS;
      gridRows=Number.isInteger(data.state.gridRows)?data.state.gridRows:DEFAULT_GRID_ROWS;
      localUpdatedAt=remoteUpdatedAt;
      saveIconsLocal(icons);saveBirthdaysLocal(birthdays);saveGridDimsLocal();saveUpdatedAtLocal(localUpdatedAt);
      renderGrid();renderCanopy();
      return true;
    }else if(remoteUpdatedAt<localUpdatedAt){
      saveToCloud(); // local is newer -- push so the cloud (and other devices) catch up
    }
    return false;
  }catch(err){cloudSyncFailed=true;return false;}
}
async function saveToCloud(){
  try{
    const res=await fetch(loadSyncEndpoint(),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'save',id:SYNC_ROW_ID,state:{icons,birthdays,gridCols,gridRows,updatedAt:localUpdatedAt}})});
    cloudSyncFailed=!res.ok;
  }catch(err){cloudSyncFailed=true;}
}
function persist(){
  localUpdatedAt=Date.now();
  saveIconsLocal(icons);saveBirthdaysLocal(birthdays);saveGridDimsLocal();saveUpdatedAtLocal(localUpdatedAt);
  saveToCloud();
}
// Catch another device's changes without requiring a manual reload:
// re-check on a timer, and immediately whenever this tab becomes visible
// again (the common real case: edit on phone, switch back to laptop tab).
setInterval(loadFromCloud,30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadFromCloud();});

// Normalizes ANY incoming icons shape (old branches+links, build-12 flat
// array with no col/row, or a genuinely current col/row array) into a
// valid current-shape array, auto-placing anything that arrives without
// a usable position. Shared by the cloud-load path above and both
// import paths below, so there's exactly one place that does this
// mapping rather than three slightly-different copies of it.
function normalizeIncomingIcons(data){
  let raw;
  if(Array.isArray(data.icons)){
    raw=data.icons.map(ic=>({id:ic.id,url:ic.url,icon:ic.icon,iconColor:ic.iconColor||DEFAULT_ICON_COLOR,name:ic.name||'',col:ic.col,row:ic.row}));
  }else if(Array.isArray(data.links)){
    // Pre-build-12 shape -- branchId/leafColor dropped (no grouping or
    // backing-shape concept survives); links' relative order across all
    // the old branches becomes the auto-placement order below.
    raw=data.links.map(l=>({id:l.id,url:l.url,icon:l.icon,iconColor:l.iconColor||DEFAULT_ICON_COLOR,name:l.name||'',col:undefined,row:undefined}));
  }else{
    return [];
  }
  const placed=[];
  raw.forEach(ic=>{
    const hasValidPos=Number.isInteger(ic.col)&&Number.isInteger(ic.row)&&
      ic.col>=0&&ic.col<gridCols&&ic.row>=0&&ic.row<gridRows&&
      !placed.some(p=>p.col===ic.col&&p.row===ic.row);
    if(hasValidPos){
      placed.push(ic);
    }else{
      const free=firstFreeCell(placed);
      if(free)placed.push({...ic,col:free.col,row:free.row});
      // if the grid is completely full, anything left over is silently
      // dropped rather than crashing the import -- edge case worth
      // knowing about if a huge old icon set hits a small grid, but not
      // worth a modal/alert for what should be a rare situation
    }
  });
  return placed;
}
function firstFreeCell(against){
  for(let r=0;r<gridRows;r++){
    for(let c=0;c<gridCols;c++){
      if(!against.some(p=>p.col===c&&p.row===r))return {col:c,row:r};
    }
  }
  return null;
}

// ── Coordinate parsing/formatting ("A1", "F3") ─────────────────────
function parseCoord(str){
  const m=(str||'').trim().toUpperCase().match(/^([A-Z])(\d+)$/);
  if(!m)return null;
  return {col:m[1].charCodeAt(0)-65,row:parseInt(m[2],10)-1};
}
function coordLabel(col,row){return String.fromCharCode(65+col)+(row+1);}

// ── Icon rendering ───────────────────────────────────────────────
function iconUrl(icon,size,color){
  const [prefix,name]=icon.split(':');
  const c=encodeURIComponent(color||DEFAULT_ICON_COLOR);
  return `https://api.iconify.design/${prefix}/${name}.svg?height=${size||64}&color=${c}`;
}

// ── Icon grid (live view) ─────────────────────────────────────────
function renderGrid(){
  const grid=document.getElementById('icon-grid');
  grid.style.gridTemplateColumns=`repeat(${gridCols},1fr)`;
  grid.innerHTML=icons.map(ic=>{
    const title=ic.name?ic.name:ic.url;
    return `<button class="grid-icon" data-id="${ic.id}" title="${title}" style="grid-column:${ic.col+1};grid-row:${ic.row+1}">
      <img src="${iconUrl(ic.icon,48,ic.iconColor)}" alt="" loading="lazy">
    </button>`;
  }).join('');
  grid.querySelectorAll('.grid-icon').forEach(el=>{
    el.addEventListener('click',()=>{
      const ic=icons.find(x=>x.id===el.getAttribute('data-id'));
      if(ic)window.open(ic.url,'_blank','noopener');
    });
  });
  document.getElementById('grid-toggle').textContent=icons.length?`Icons (${icons.length}) ▾`:'';
  document.getElementById('grid-toggle').style.display=icons.length?'':'none';
  reportHeight();
}
window.addEventListener('resize',reportHeight);

// Mobile collapse (build 13) -- collapsed by default, a tap expands the
// same grid inline. Resets to collapsed on every load; not persisted,
// since "did I leave it open last time" isn't something worth
// remembering across visits.
document.getElementById('grid-toggle').addEventListener('click',()=>{
  const wrap=document.getElementById('icon-grid-wrap');
  const grid=document.getElementById('icon-grid');
  const nowExpanded=wrap.classList.toggle('expanded');
  grid.classList.toggle('expanded-grid',nowExpanded);
  document.getElementById('grid-toggle').textContent=nowExpanded?'▴':`Icons (${icons.length}) ▾`;
  reportHeight();
});

// ── Edit pane ──────────────────────────────────────────────────────
function openEditPane(){
  renderEditPane();
  requestFullHeight();
  document.getElementById('edit-modal').classList.remove('hidden');
}
function closeEditPane(){
  document.getElementById('edit-modal').classList.add('hidden');
  releaseFullHeight();
  renderGrid();
}
document.getElementById('main-knot').addEventListener('click',openEditPane);
document.getElementById('close-edit').addEventListener('click',closeEditPane);
document.getElementById('add-icon-btn').addEventListener('click',()=>{
  const free=firstFreeCell(icons);
  if(!free){alert('The grid is full — resize it (top of this pane) or remove an icon first.');return;}
  openIconPicker(icon=>{
    icons.push({id:'icon_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),url:'https://',icon,iconColor:DEFAULT_ICON_COLOR,name:'',col:free.col,row:free.row});
    persist();renderEditPane();
  });
});

// Grid-dimensions control -- validates that shrinking never silently
// strands an existing icon outside the new bounds; growing is always
// safe (nothing already placed can become invalid) so only the shrink
// direction needs the stranded-icon check.
document.getElementById('grid-dims-input').addEventListener('change',e=>{
  const errEl=document.getElementById('grid-dims-err');
  errEl.textContent='';
  const m=e.target.value.trim().match(/^(\d+)\s*[xX]\s*(\d+)$/);
  if(!m){errEl.textContent='Use the format 5x4 (columns x rows).';e.target.value=`${gridCols}x${gridRows}`;return;}
  const newCols=parseInt(m[1],10), newRows=parseInt(m[2],10);
  if(newCols<1||newRows<1){errEl.textContent='Needs at least 1 column and 1 row.';e.target.value=`${gridCols}x${gridRows}`;return;}
  if(newCols>MAX_GRID_COLS){errEl.textContent=`${MAX_GRID_COLS} columns max (single-letter labels, A–Z).`;e.target.value=`${gridCols}x${gridRows}`;return;}
  const stranded=icons.find(ic=>ic.col>=newCols||ic.row>=newRows);
  if(stranded){
    errEl.textContent=`Can't shrink to ${newCols}x${newRows} — "${stranded.name||stranded.url}" is at ${coordLabel(stranded.col,stranded.row)}, which no longer fits. Move or remove it first.`;
    e.target.value=`${gridCols}x${gridRows}`;
    return;
  }
  gridCols=newCols;gridRows=newRows;
  persist();renderGrid();renderEditPane();
});

  try{

    const data=JSON.parse(text);
    if(Number.isInteger(data.gridCols)&&Number.isInteger(data.gridRows)){
      gridCols=data.gridCols;gridRows=data.gridRows;
    }
    icons=normalizeIncomingIcons(data); // handles old branches+links, build-12 flat arrays, and current col/row arrays all the same way

    alert("Couldn't read that backup file.");

});

// ── Icons edit list (build 13 redesign) ─────────────────────────────
// Replaces build 12's four move-buttons-per-icon with a single position
// field the person types a coordinate into directly ("A1", "F3") --
// validated on change against the current grid bounds and against every
// OTHER icon's position, with the specific, requested "that spot is
// taken" message rather than silently overwriting or rejecting.
function renderEditPane(){
  document.getElementById('grid-dims-input').value=`${gridCols}x${gridRows}`;
  document.getElementById('grid-dims-err').textContent='';
  const wrap=document.getElementById('edit-icons');
  wrap.innerHTML=icons.map(ic=>`
    <div class="icon-edit-row" data-id="${ic.id}">
      <div class="row1">
        <img src="${iconUrl(ic.icon,26,ic.iconColor)}" alt="">
        <input type="text" class="name-field" data-action="icon-name" data-id="${ic.id}" placeholder="Name" value="${ic.name?ic.name.replace(/"/g,'&quot;'):''}">
        <input type="url" data-action="icon-url" data-id="${ic.id}" value="${ic.url}">
      </div>
      <div class="row2">
        <button class="tiny-btn" data-action="change-icon" data-id="${ic.id}" title="Change icon">icon</button>
        <input type="color" data-action="icon-color" data-id="${ic.id}" value="${ic.iconColor||DEFAULT_ICON_COLOR}" title="Icon color">
        <input type="text" class="pos-field" data-action="icon-pos" data-id="${ic.id}" value="${coordLabel(ic.col,ic.row)}" maxlength="4">
        <button class="tiny-btn danger" data-action="delete-icon" data-id="${ic.id}">delete</button>
        <span class="pos-err-msg" data-err-for="${ic.id}"></span>
      </div>
    </div>`).join('')||'<div style="color:var(--ink3);font-size:.8rem;text-align:center">No icons yet.</div>';

  wrap.querySelectorAll('[data-action="icon-name"]').forEach(el=>{
    el.addEventListener('change',()=>{
      const ic=icons.find(x=>x.id===el.getAttribute('data-id'));
      if(ic){ic.name=el.value.trim();persist();}
    });
  });
  wrap.querySelectorAll('[data-action="icon-url"]').forEach(el=>{
    el.addEventListener('change',()=>{
      const ic=icons.find(x=>x.id===el.getAttribute('data-id'));
      let v=el.value.trim();
      if(v&&!/^https?:\/\//i.test(v))v='https://'+v;
      if(ic){ic.url=v;el.value=v;persist();}
    });
  });
  wrap.querySelectorAll('[data-action="icon-color"]').forEach(el=>{
    el.addEventListener('input',()=>{
      const ic=icons.find(x=>x.id===el.getAttribute('data-id'));
      if(ic){ic.iconColor=el.value;persist();renderEditPane();renderGrid();}
    });
  });
  wrap.querySelectorAll('[data-action="delete-icon"]').forEach(el=>{
    el.addEventListener('click',()=>{
      icons=icons.filter(x=>x.id!==el.getAttribute('data-id'));
      persist();renderEditPane();renderGrid();
    });
  });
  wrap.querySelectorAll('[data-action="change-icon"]').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.getAttribute('data-id');
      openIconPicker(icon=>{
        const ic=icons.find(x=>x.id===id);
        if(ic){ic.icon=icon;persist();renderEditPane();renderGrid();}
      });
    });
  });
  wrap.querySelectorAll('[data-action="icon-pos"]').forEach(el=>{
    el.addEventListener('change',()=>{
      const id=el.getAttribute('data-id');
      const ic=icons.find(x=>x.id===id);
      const errEl=wrap.querySelector(`[data-err-for="${id}"]`);
      el.classList.remove('err');errEl.textContent='';
      const coord=parseCoord(el.value);
      if(!coord){
        errEl.textContent='Use a column letter + row number, like A1.';
        el.classList.add('err');el.value=coordLabel(ic.col,ic.row);return;
      }
      if(coord.col>=gridCols||coord.row>=gridRows){
        errEl.textContent=`Outside the current ${gridCols}x${gridRows} grid.`;
        el.classList.add('err');el.value=coordLabel(ic.col,ic.row);return;
      }
      const occupant=icons.find(x=>x.id!==id&&x.col===coord.col&&x.row===coord.row);
      if(occupant){
        errEl.textContent='That spot is taken.';
        el.classList.add('err');el.value=coordLabel(ic.col,ic.row);return;
      }
      ic.col=coord.col;ic.row=coord.row;
      el.value=coordLabel(ic.col,ic.row);
      persist();renderGrid();
    });
  });
}

let iconPickCallback=null, searchDebounce=null;
function openIconPicker(onPick){
  iconPickCallback=onPick;
  document.getElementById('icon-query').value='';
  document.getElementById('icon-search-results').innerHTML='';
  document.getElementById('icon-search-status').textContent='';
  document.getElementById('icon-pick-modal').classList.remove('hidden');
  document.getElementById('icon-query').focus();
}
document.getElementById('close-icon-pick').addEventListener('click',()=>{
  document.getElementById('icon-pick-modal').classList.add('hidden');
});
document.getElementById('icon-query').addEventListener('input',e=>{
  const q=e.target.value.trim();
  clearTimeout(searchDebounce);
  if(!q){document.getElementById('icon-search-results').innerHTML='';document.getElementById('icon-search-status').textContent='';return;}
  document.getElementById('icon-search-status').textContent='Searching…';
  searchDebounce=setTimeout(()=>runIconSearch(q),350);
});
async function runIconSearch(query){
  const statusEl=document.getElementById('icon-search-status');
  const resultsEl=document.getElementById('icon-search-results');
  try{
    const res=await fetch(`https://api.iconify.design/search?query=${encodeURIComponent(query)}&limit=64`);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const iconsFound=data.icons||[];
    if(!iconsFound.length){resultsEl.innerHTML='';statusEl.textContent='No icons found for "'+query+'"';return;}
    statusEl.textContent='';
    resultsEl.innerHTML=iconsFound.map(id=>`<div class="res" data-icon="${id}"><img src="${iconUrl(id,40)}" loading="lazy" alt=""></div>`).join('');
    resultsEl.querySelectorAll('.res').forEach(el=>{
      el.addEventListener('click',()=>{
        const icon=el.getAttribute('data-icon');
        document.getElementById('icon-pick-modal').classList.add('hidden');
        if(iconPickCallback)iconPickCallback(icon);
      });
    });
  }catch(err){
    resultsEl.innerHTML='';
    statusEl.textContent='Icon search unavailable right now — try again in a moment.';
  }
}

function timeGreeting(d){
  const h=d.getHours();
  if(h>=5&&h<12)return 'Bonjour\u00A0!';
  if(h>=12&&h<18)return 'Bon après-midi\u00A0!';
  if(h>=18&&h<22)return 'Bonsoir\u00A0!';
  return 'Bonne nuit\u00A0!';
}

function nthWeekdayOfMonth(year,month,weekday,n){
  const d=new Date(year,month,1);
  let count=0;
  while(d.getMonth()===month){
    if(d.getDay()===weekday){count++;if(count===n)return new Date(d);}
    d.setDate(d.getDate()+1);
  }
  return null;
}
function lastWeekdayOfMonth(year,month,weekday){
  const d=new Date(year,month+1,0);
  while(d.getDay()!==weekday)d.setDate(d.getDate()-1);
  return d;
}
function sameDate(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}

function floatingHolidaysForYear(year){
  const out=[];
  const push=(date,name,greeting,solemn)=>{if(date)out.push({date,name,greeting:greeting||null,solemn:!!solemn});};
  push(nthWeekdayOfMonth(year,0,1,3),'Martin Luther King Jr. Day',null,true);
  const febThirdMon=nthWeekdayOfMonth(year,1,1,3);
  push(febThirdMon,"le Presidents' Day",null,true);
  push(febThirdMon,'la fête de la Famille','Bonne fête de la Famille !');
  const lastMonMay=lastWeekdayOfMonth(year,4,1);
  push(lastMonMay,'le Memorial Day',null,true);
  push(lastMonMay,'la fête de Victoria','Bonne fête de Victoria !');
  push(lastMonMay,'la Journée nationale des patriotes','Bonne Journée des Patriotes !');
  push(nthWeekdayOfMonth(year,8,1,1),'la fête du Travail','Bonne fête du Travail !');
  const octSecondMon=nthWeekdayOfMonth(year,9,1,2);
  push(octSecondMon,"l'Action de grâce",'Joyeux Action de grâce !');
  push(octSecondMon,'le Columbus Day',null,true);
  push(nthWeekdayOfMonth(year,10,4,4),'le Thanksgiving',"Bon Thanksgiving !");
  return out;
}

function todaysHolidays(now){
  const y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate();
  const hits=[];
  FIXED_HOLIDAYS.forEach(h=>{if(h.month===m&&h.day===d)hits.push(h);});
  floatingHolidaysForYear(y).forEach(h=>{if(sameDate(h.date,now))hits.push(h);});
  const todayDate=new Date(y,m-1,d);
  JEWISH_HOLIDAYS.forEach(h=>{
    const start=new Date(h.y,h.m-1,h.d),end=new Date(h.y2,h.m2-1,h.d2);
    if(todayDate>=start&&todayDate<=end)hits.push(h);
  });
  return hits;
}

function birthdaysToday(now){
  const m=now.getMonth()+1,d=now.getDate();
  return birthdays.filter(b=>b.month===m&&b.day===d);
}

function renderCanopy(){

  const subEl=document.getElementById('canopy-sub');
  if(!mainEl||!subEl)return;
  mainEl.textContent=timeGreeting(now);

## What this is

A personal icon launcher: a grid of icons at explicit, hand-placed positions, each linking out to a site or tool. Also carries Verdure's page heading (a French time-of-day greeting recognizing American/Canadian/Québécois/Jewish holidays and friends' birthdays) and its own birthday list, both unrelated to the icon grid itself but living in this file per Verdure's own doc.

## Build 13 — three real problems fixed in one pass

**1. Cross-device sync was silently one-directional.** Build 12's \`loadFromCloud()\` only ever pulled from the cloud into a device with NO existing data at all (\`if(icons.length||birthdays.length){saveToCloud();return false;}\`) — meaning any device that already had icons, which after first use is every device, never looked at the cloud again; it only ever overwrote it. Two devices that both had data could drift forever, each clobbering the other's changes the next time either one saved. This is exactly the reported symptom ("changes don't always show up on the other computer").

Fixed with real (if simple) last-write-wins reconciliation: every \`persist()\` stamps \`updatedAt=Date.now()\`, and \`loadFromCloud()\` now **always** fetches the remote state and compares timestamps, adopting whichever side is actually newer — regardless of which device already has data. Also now runs on a 30-second timer and on \`visibilitychange\` (tab regaining focus), not just on page load, so a device left open picks up another device's edits without needing a manual reload. **This is still not true simultaneous-edit merging** — if both devices genuinely edit between syncs, one side's changes are still lost, not merged — but for one person's own data across their own devices, last-write-wins is the standard, reasonable tradeoff, and the important part is that it now actually runs symmetrically on every device instead of only running in one direction.

**2. The two knots didn't make sense as knots anymore.** They were tree-bark-colored organic blobs, unattached to anything (no trunk since build 12). Replaced with plain small buttons (\`#corner-buttons\`, labeled "Edit" and "Bdays"), positioned in the bottom-right corner of Branche's own content area — not the page/viewport corner, which is where the invisible context-doc button already lives (\`#doc-btn\`, unrelated, unaffected).

**3. The edit pane was genuinely hard to use.** Build 12 crammed 4 move-buttons (▲◀▼▶) plus delete, icon-picker, and color-picker onto one line per icon inside a 560px-wide modal — too many small controls competing for space, which is almost certainly why editing a URL felt broken (the URL field was simply being starved of width by everything else in that row, not actually non-functional). Fixed by widening the modal (560px → 680px, 88vh → 90vh) and replacing the four move-buttons with a single position field per icon (see Icon grid mechanics below) — fewer, wider controls per row.

## Icon grid mechanics (build 13 — replaces build 12's flat-array-order model)

\`icons = [{id, url, icon, iconColor, name, col, row}]\` — **explicit 0-indexed coordinates now**, not array order. \`gridCols\`/\`gridRows\` are user-editable state (a "5x4"-style text field at the top of the edit pane), not a fixed constant. Positions are entered/edited as a spreadsheet-style label — column letter (A, B, C…) + row number (1, 2, 3…) — via \`parseCoord()\`/\`coordLabel()\`. Column letters are single-character only, so \`MAX_GRID_COLS=26\`; documented at the constant and enforced on the grid-size input.

**Placing an icon**: type a coordinate like \`A1\` or \`F3\` into that icon's position field in the edit pane. On change, it's validated against the *current* grid bounds and against every other icon's position — if the target cell already holds a different icon, the field shows **"That spot is taken."** and reverts to the icon's previous position rather than silently swapping or overwriting anything (this was explicitly requested, not an assumption). A genuinely malformed entry ("xyz", "12", empty) gets "Use a column letter + row number, like A1." instead of silently failing.

**Resizing the grid**: the "5x4" field at the top of the edit pane. Growing is always safe (nothing already placed can become invalid). Shrinking is validated — if any existing icon would fall outside the new dimensions, the resize is rejected with a specific message naming the icon and its position, rather than silently stranding or deleting it. \`gridCols\`/\`gridRows\` are synced/exported alongside \`icons\`/\`birthdays\`.

**Adding a new icon** auto-places it in the first free cell (row-major scan, \`firstFreeCell()\`) rather than requiring a position up front — the person can then retype its position if they want it somewhere specific. If the grid is completely full, an alert says so rather than the click silently doing nothing.

**No live drag-and-drop** — deliberate, matching this file's pre-build-13 convention (branch/leaf reordering was always button-based; this just swaps buttons for a text field, not the no-drag philosophy itself).

## Migration — three possible incoming shapes, one function

\`normalizeIncomingIcons(data)\` is the single place that turns *any* prior format into a valid current \`{col,row}\` array, used identically by **Import backup**, the **cloud-load path**, and available for any future format changes to route through the same way rather than duplicating the mapping logic three times:
- **Pre-build-12** (\`{branches, links}\`): \`branchId\`/\`leafColor\` dropped (no grouping/backing-shape concept survives), links' relative order across all the old branches becomes the auto-placement scan order.
- **Build 12** (\`{icons: [...]}\`, flat array, no \`col\`/\`row\`): same auto-placement scan, in the array's existing order.
- **Build 13+** (\`{icons: [...]}\` with real \`col\`/\`row\`): used directly, UNLESS a given position is out of the *current* grid's bounds or collides with another icon already placed earlier in the scan — in which case that one icon falls back to auto-placement rather than the whole import failing.

If the grid is too small to fit everything being imported, remaining icons are silently dropped rather than erroring — worth knowing about if a large icon set ever hits a small grid, but not treated as importer-breaking.

## Two knots, now corner buttons (not redesigned again, just restyled+repositioned)

Build 11 gave birthdays their own knot next to the main one; build 12 moved both off the (now-gone) trunk to a centered row below the grid; build 13 restyles them as plain small text-label buttons (\`.corner-btn\`) and right-aligns them to the bottom-right of \`#app\` (\`position:absolute\`, since \`#app\` is \`position:relative\`). Same separate-modals behavior throughout (\`openEditPane\`/\`openBirthdaysPane\`) — only the visual treatment and position have changed across these three builds, never the underlying behavior.

## Mobile: collapsed by default (build 13)

A multi-row grid at full size is a lot of permanent vertical space on a phone. \`#grid-toggle\` (a small "Icons (N) ▾" button, mobile-only via the existing \`480px\` media query) hides \`#icon-grid-wrap\` by default and reveals the *same* grid inline on tap — no separate mobile layout, no data difference, purely a CSS/JS visibility toggle. Resets to collapsed on every reload; not persisted, since "was it open last time" isn't worth remembering across visits. Desktop is unaffected (\`#grid-toggle{display:none}\` outside the media query).

## Canopy heading — punctuation and spacing (build 12, unchanged in 13)

\`timeGreeting()\`'s four return values end in \`\\u00A0!\` (non-breaking space before the exclamation mark — correct French typography). \`#canopy\`'s bottom padding was cut and the grid given a small explicit \`margin-top\` instead, so the gap between the greeting and the icon grid is deliberately tighter than default block spacing.

## Birthdays, holiday recognition — unchanged from build 11/12

See prior build history below for the mechanics; none of it depends on the icon grid or knot markup, so none of it needed to change in this pass beyond what's already noted above.

**Birthdays**: \`birthdays = [{id, name, month, day}]\`, no year. Same-day only — "Bon anniversaire \\<name\\> !" in French, no advance reminder, no emoji (both removed build 11, weren't asked for). Own modal (\`#birthdays-modal\`, opened by \`#bday-knot\`), editing UI in English, displayed greeting text in French.

**Holidays**: \`FIXED_HOLIDAYS\` (flat month/day list), \`floatingHolidaysForYear()\` (nth-weekday-of-month rules, computed per year), \`JEWISH_HOLIDAYS\` (hardcoded lookup table — Gregorian dates shift yearly on the lunisolar Hebrew calendar, correctly computing that live was out of scope; sourced from URJ's 5786–5790 calendar, **currently only reaches Spring 2030**, extend via "hebcal holidays \\<year\\>-\\<year+1\\>" — see the comment above \`JEWISH_HOLIDAYS\`). \`solemn:true\` holidays (Yom Kippur, Tisha B'Av, Remembrance/Veterans/Memorial Day, MLK Day, Presidents' Day, Columbus Day) show by name only, no invented "Happy X!".
