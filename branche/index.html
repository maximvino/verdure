<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- Branche — build 15 -->
<title>Branche</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#0e1c12;
  --surface:#17281a;
  --ink:#f3ead6;
  --ink2:#c3b394;
  --ink3:#8a7c62;
  --border:rgba(224,198,150,.1);
  --border2:rgba(224,198,150,.18);
  --root:#7f9767;
  --knot:#2f2013;
  --danger:#c9705a;
  --font-h:'Lora',Georgia,serif;
  --font-b:'DM Sans',sans-serif;
}
html,body{background:var(--page);color:var(--ink);font-family:var(--font-b);overflow-x:hidden}
#app{padding:20px 0 20px}
/* Same max-width/centering as Racine and Fleur, so the corner buttons
   land directly above Racine's own top-right buttons when stacked in
   Verdure -- that alignment was the whole point of moving them there. */
.branche-inner{max-width:1160px;margin:0 auto;position:relative}

#canopy{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 10px 0;user-select:none;text-align:center}
.canopy-main{font-family:var(--font-h);font-weight:500;font-size:1.3rem;color:var(--ink)}
.canopy-sub{font-family:var(--font-b);font-size:.72rem;color:var(--ink2);line-height:1.5;max-width:280px;margin:0 auto}
.canopy-sub:empty{display:none}
.canopy-sub .cs-holiday{color:var(--ink2)}
.canopy-sub .cs-bday{color:var(--root)}

/* ── Icon grid: bare icons, no backing shape. 10x3 default (build 14) --
   sized so 10 columns fit comfortably at the shared 1160px max-width
   without cramping (see gap/padding below, tuned for that width). ── */
#icon-grid-wrap{margin:6px auto 0;padding:0 16px}
#icon-grid{display:grid;gap:16px 12px;padding:4px 0 16px;justify-items:center}
#icon-grid:empty{padding:0;margin:0}
.grid-icon{cursor:pointer;background:none;border:none;padding:4px;display:flex;align-items:center;justify-content:center;
  width:100%;aspect-ratio:1;border-radius:10px}
.grid-icon:hover{background:rgba(255,255,255,.06)}
.grid-icon img{width:60%;height:60%;object-fit:contain}

/* Mobile: collapsed by default, tap to expand -- same grid, no separate layout. */
#grid-toggle{display:none;width:100%;max-width:340px;margin:6px auto 0;background:rgba(255,255,255,.05);
  border:1px solid var(--border2);border-radius:10px;padding:10px;color:var(--ink2);font-family:var(--font-b);
  font-size:.8rem;cursor:pointer;text-align:center}
@media (max-width:480px){
  #grid-toggle{display:block}
  #icon-grid-wrap{display:none;max-width:340px;margin:6px auto 0}
  #icon-grid-wrap.expanded{display:block}
  #icon-grid.expanded-grid{gap:10px 8px;padding:4px 0 12px}
}

/* ── Corner buttons (build 13, icons instead of words as of build 14) --
   right-aligned within .branche-inner (the shared 1160px column), same
   row-position convention Racine already uses for its own top-right
   buttons, matching padding so the two rows' buttons sit flush above
   one another. ── */
#corner-buttons{display:flex;justify-content:flex-end;gap:6px;padding:6px 5px 0}
.corner-btn{background:rgba(255,255,255,.06);border:1px solid var(--border2);border-radius:6px;
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.corner-btn:hover{background:rgba(255,255,255,.12)}
.corner-btn img{width:16px;height:16px}

/* ── Edit pane ── */
.modal{position:fixed;inset:0;background:rgba(10,7,3,.72);display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px}
.modal.hidden{display:none}
.modal-card{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:20px;
  width:100%;max-width:720px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.5);
  display:flex;flex-direction:column;gap:14px}
.modal-card h2{font-family:var(--font-h);font-weight:500;font-size:1.1rem}
.modal-card h3{font-family:var(--font-h);font-weight:500;font-size:.9rem;color:var(--ink2)}

.grid-dims-row{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.grid-dims-row label{font-size:.78rem;color:var(--ink2)}
.grid-dims-row input{width:70px;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:6px;padding:6px 8px;font-size:.85rem;color:var(--ink);font-family:var(--font-b);outline:none;text-align:center}
.grid-dims-err{color:var(--danger);font-size:.72rem}

/* ── Drag-and-drop position grid (build 14 — replaces the "A1" text-
   coordinate system entirely, which turned out to be the wrong call).
   A miniature version of the live grid where each icon is a native
   HTML5 draggable element; dropping onto another icon's cell swaps the
   two positions, dropping onto an empty cell just moves it there. ── */
#drag-grid-wrap{border:1px solid var(--border2);border-radius:10px;padding:12px;background:rgba(0,0,0,.15)}
#drag-grid{display:grid;gap:6px}
.drag-cell{aspect-ratio:1;border:1px dashed var(--border2);border-radius:6px;display:flex;align-items:center;
  justify-content:center;background:rgba(255,255,255,.02)}
.drag-cell.drag-over{background:rgba(190,220,170,.18);border-color:var(--root)}
.drag-icon{width:80%;height:80%;cursor:grab;display:flex;align-items:center;justify-content:center;border-radius:6px}
.drag-icon:active{cursor:grabbing}
.drag-icon.dragging{opacity:.35}
.drag-icon img{width:70%;height:70%;object-fit:contain;pointer-events:none}
.drag-hint{font-size:.68rem;color:var(--ink3);text-align:center;padding-top:6px}

/* ── Icon edit rows -- alphabetical list (build 14), no position field
   anymore (that's the drag grid above now). ── */
.icon-edit-row{border-top:1px solid var(--border);padding:8px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.icon-edit-row img{width:24px;height:24px;object-fit:contain;flex-shrink:0}
.icon-edit-row input[type=text]{width:110px;flex:none;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:6px;padding:6px 9px;font-size:.8rem;color:var(--ink);font-family:var(--font-b);outline:none}
.icon-edit-row input[type=url]{flex:1;min-width:140px;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:6px;padding:6px 9px;font-size:.8rem;color:var(--ink);font-family:var(--font-b);outline:none}
.icon-edit-row input[type=color]{width:24px;height:24px;border:none;padding:0;border-radius:50%;cursor:pointer;background:none;flex-shrink:0}
.icon-edit-row input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.icon-edit-row input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
.tiny-btn{background:rgba(255,255,255,.06);border:none;color:var(--ink2);border-radius:5px;
  font-size:11px;padding:4px 8px;cursor:pointer}
.tiny-btn:hover{background:rgba(255,255,255,.12)}
.tiny-btn.danger{color:var(--danger)}
.add-icon-btn{background:none;border:1.5px dashed var(--root);color:var(--root);
  border-radius:8px;padding:10px;font-size:.75rem;cursor:pointer;font-family:var(--font-b);width:100%;margin-top:4px}

.bday-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border)}
.bday-row input[type=text]{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:6px;padding:5px 8px;font-size:.78rem;color:var(--ink);font-family:var(--font-b);outline:none}
.bday-row input[type=date]{background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:6px;padding:4px 6px;font-size:.72rem;color:var(--ink);font-family:var(--font-b);outline:none;color-scheme:dark}
.add-bday-row{display:flex;gap:8px;margin-top:8px}
.add-bday-row input[type=text]{flex:1;min-width:0}

.backup-row{display:flex;gap:14px;justify-content:center;padding:10px 0 2px}
.link-btn{background:none;border:none;color:var(--root);font-family:var(--font-b);
  font-size:.72rem;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:2px}
.link-btn:hover{color:var(--ink2)}
.modal-actions{display:flex;justify-content:flex-end}
.btn-done{background:none;border:1px solid var(--border2);color:var(--ink2);border-radius:20px;
  padding:6px 16px;font-family:var(--font-b);font-size:.78rem;cursor:pointer}
.btn-done:hover{background:rgba(255,255,255,.05)}

.icon-search-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;
  max-height:340px;overflow-y:auto;padding:4px}
.icon-search-results .res{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;background:rgba(255,255,255,.05)}
.icon-search-results .res:hover{background:rgba(190,220,170,.22)}
.icon-search-results .res img{width:65%;height:65%;object-fit:contain}
.icon-search-status{color:var(--ink3);font-size:.72rem;text-align:center;padding:8px 0}
.modal-card input[type=text].search-input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  border-radius:8px;padding:9px 11px;font-size:.85rem;color:var(--ink);font-family:var(--font-b);outline:none}
#doc-btn{position:fixed;bottom:0;right:0;width:14px;height:14px;border:none;background:transparent;
  cursor:pointer;z-index:9999;padding:0;opacity:0;transition:opacity .2s}
#doc-btn:hover{opacity:.3;background:radial-gradient(circle,#fff 0%,transparent 70%)}
</style>
</head>
<body>

<div id="app">
  <div class="branche-inner">
    <div id="canopy">
      <div class="canopy-main" id="canopy-main"></div>
      <div class="canopy-sub" id="canopy-sub"></div>
    </div>
    <button id="grid-toggle"></button>
    <div id="icon-grid-wrap"><div id="icon-grid"></div></div>
    <div id="corner-buttons">
      <button class="corner-btn" id="main-knot" title="Edit Branche"><img src="" alt="Edit" id="main-knot-img"></button>
      <button class="corner-btn" id="bday-knot" title="Edit Birthdays"><img src="" alt="Birthdays" id="bday-knot-img"></button>
    </div>
  </div>
</div>
<button id="doc-btn" title="Download Branche context doc"></button>

<div class="modal hidden" id="edit-modal">
  <div class="modal-card">
    <h2>Edit Branche</h2>
    <div class="grid-dims-row">
      <label for="grid-dims-input">Grid size (columns x rows)</label>
      <input type="text" id="grid-dims-input" placeholder="10x3">
      <span class="grid-dims-err" id="grid-dims-err"></span>
    </div>
    <div id="drag-grid-wrap">
      <div id="drag-grid"></div>
      <div class="drag-hint">Drag an icon onto another to swap places, or onto an empty cell to move it there.</div>
    </div>
    <h3>Icons (A–Z)</h3>
    <div id="edit-icons"></div>
    <button class="add-icon-btn" id="add-icon-btn">+ Add icon</button>
    <div class="backup-row">
      <button class="link-btn" id="export-btn">Export backup</button>
      <button class="link-btn" id="import-btn">Import backup</button>
      <input type="file" id="import-file" accept="application/json" style="display:none">
    </div>
    <div class="modal-actions"><button class="btn-done" id="close-edit">Done</button></div>
  </div>
</div>

<div class="modal hidden" id="birthdays-modal">
  <div class="modal-card">
    <h2>Birthdays</h2>
    <div id="edit-birthdays"></div>
    <div class="add-bday-row">
      <input type="text" id="new-bday-name" placeholder="Name">
      <input type="date" id="new-bday-date">
      <button class="tiny-btn" id="add-bday-btn">+ Add</button>
    </div>
    <div class="modal-actions"><button class="btn-done" id="close-birthdays">Done</button></div>
  </div>
</div>

<div class="modal hidden" id="icon-pick-modal">
  <div class="modal-card">
    <h2>Choose an icon</h2>
    <input type="text" class="search-input" id="icon-query" placeholder="Search (e.g. youtube)">
    <div class="icon-search-status" id="icon-search-status"></div>
    <div class="icon-search-results" id="icon-search-results"></div>
    <div class="modal-actions"><button class="btn-done" id="close-icon-pick">Cancel</button></div>
  </div>
</div>

<script>
// ── Storage ──────────────────────────────────────────────────────
const ICONS_KEY='branche_icons';
const GRID_DIMS_KEY='branche_grid_dims';
const UPDATED_AT_KEY='branche_updated_at';
const BIRTHDAYS_KEY='branche_birthdays';
const SYNC_KEY='branche_sync_endpoint';
const DEFAULT_SYNC='https://oldfleurplanner.netlify.app/api/sync';
const SYNC_ROW_ID=3;
const DEFAULT_ICON_COLOR='#f3ead6';
const DEFAULT_GRID_COLS=10, DEFAULT_GRID_ROWS=3; // build 14: was 5x4
const MAX_GRID_COLS=40, MAX_GRID_ROWS=20; // sanity caps only -- no longer tied to A-Z letters (drag-and-drop replaced the coordinate-typing system)
const EDIT_KNOT_ICON='mdi:cog-outline';
const BDAY_KNOT_ICON='mdi:cake-variant-outline';

function loadIconsLocal(){try{return JSON.parse(localStorage.getItem(ICONS_KEY))||[];}catch(e){return [];}}
function saveIconsLocal(v){localStorage.setItem(ICONS_KEY,JSON.stringify(v));}
function loadGridDimsLocal(){
  try{
    const d=JSON.parse(localStorage.getItem(GRID_DIMS_KEY));
    if(d&&Number.isInteger(d.cols)&&Number.isInteger(d.rows))return d;
  }catch(e){}
  return {cols:DEFAULT_GRID_COLS,rows:DEFAULT_GRID_ROWS};
}
function saveGridDimsLocal(){localStorage.setItem(GRID_DIMS_KEY,JSON.stringify({cols:gridCols,rows:gridRows}));}
function loadUpdatedAtLocal(){return parseInt(localStorage.getItem(UPDATED_AT_KEY)||'0',10);}
function saveUpdatedAtLocal(v){localStorage.setItem(UPDATED_AT_KEY,String(v));}
function loadBirthdaysLocal(){try{return JSON.parse(localStorage.getItem(BIRTHDAYS_KEY))||[];}catch(e){return [];}}
function saveBirthdaysLocal(v){localStorage.setItem(BIRTHDAYS_KEY,JSON.stringify(v));}
function loadSyncEndpoint(){return localStorage.getItem(SYNC_KEY)||DEFAULT_SYNC;}

const _dims=loadGridDimsLocal();
let gridCols=_dims.cols, gridRows=_dims.rows;
// BUILD 14 CRITICAL FIX: build 13 loaded raw localStorage directly into
// `icons` with NO normalization pass -- only the cloud-load and import
// paths ran icons through normalizeIncomingIcons(). Anyone whose
// localStorage still held a pre-build-13 shape (build 12's flat array,
// no col/row at all) got icons with col:undefined/row:undefined, which
// produces invalid `grid-column:NaN` CSS in renderGrid() -- those icons
// silently fail to render on the live grid while still showing fine in
// the edit list (which doesn't depend on a valid position to display a
// name/url/thumbnail). THIS is almost certainly the "icons disappeared"
// bug. Fixed by running the raw local load through the exact same
// normalizeIncomingIcons() the cloud/import paths already used, so
// EVERY load path guarantees valid integer col/row before anything else
// runs -- there is now exactly one way icons ever enter this app's
// state, not two slightly-different ones.
let icons=normalizeIncomingIcons({icons:loadIconsLocal()});
let birthdays=loadBirthdaysLocal();
let localUpdatedAt=loadUpdatedAtLocal();

// ── Cross-device sync (build 13; ordering bug fixed in build 14) ────
// Real last-write-wins reconciliation: every save stamps `updatedAt`,
// and loadFromCloud() always fetches remote and adopts whichever side
// is actually newer. Also re-checks periodically and on visibilitychange
// so a device left open picks up another device's edits.
//
// BUILD 14 FIX: gridCols/gridRows used to be updated AFTER calling
// normalizeIncomingIcons() on the incoming remote state, which meant
// incoming icons were bounds-checked against the WRONG (stale/local)
// grid dimensions whenever the remote's actual grid size differed from
// this device's current one -- potentially mis-validating or
// mis-auto-placing icons that were actually fine. Dimensions are now
// applied BEFORE normalization runs, so validation always happens
// against the grid size the icons actually belong to.
let cloudSyncFailed=false;
async function loadFromCloud(){
  try{
    const res=await fetch(loadSyncEndpoint(),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'load',id:SYNC_ROW_ID})});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data||!data.state){
      if(icons.length||birthdays.length)saveToCloud();
      return false;
    }
    const remoteUpdatedAt=data.state.updatedAt||0;
    if(remoteUpdatedAt>localUpdatedAt){
      gridCols=Number.isInteger(data.state.gridCols)?data.state.gridCols:DEFAULT_GRID_COLS;
      gridRows=Number.isInteger(data.state.gridRows)?data.state.gridRows:DEFAULT_GRID_ROWS;
      icons=normalizeIncomingIcons(data.state); // now runs against the correct (just-updated) dimensions
      birthdays=Array.isArray(data.state.birthdays)?data.state.birthdays:[];
      localUpdatedAt=remoteUpdatedAt;
      saveIconsLocal(icons);saveBirthdaysLocal(birthdays);saveGridDimsLocal();saveUpdatedAtLocal(localUpdatedAt);
      renderGrid();renderCanopy();
      return true;
    }else if(remoteUpdatedAt<localUpdatedAt){
      saveToCloud();
    }
    return false;
  }catch(err){cloudSyncFailed=true;return false;}
}
async function saveToCloud(){
  try{
    const res=await fetch(loadSyncEndpoint(),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'save',id:SYNC_ROW_ID,state:{icons,birthdays,gridCols,gridRows,updatedAt:localUpdatedAt}})});
    cloudSyncFailed=!res.ok;
  }catch(err){cloudSyncFailed=true;}
}
function persist(){
  localUpdatedAt=Date.now();
  saveIconsLocal(icons);saveBirthdaysLocal(birthdays);saveGridDimsLocal();saveUpdatedAtLocal(localUpdatedAt);
  saveToCloud();
}
setInterval(loadFromCloud,30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadFromCloud();});

// Normalizes ANY incoming icons shape -- old branches+links, build-12
// flat array (no col/row), or a genuinely current col/row array -- into
// a valid array with guaranteed integer col/row, auto-placing anything
// that arrives without a usable/valid position. This is now the ONLY
// way icons ever enter the app's live state (see build-14 fix note at
// the `let icons=` line above) -- used identically by the initial local
// load, cloud-load, and both import paths.
function normalizeIncomingIcons(data){
  let raw;
  if(Array.isArray(data.icons)){
    raw=data.icons.map(ic=>({id:ic.id,url:ic.url,icon:ic.icon,iconColor:ic.iconColor||DEFAULT_ICON_COLOR,name:ic.name||'',col:ic.col,row:ic.row}));
  }else if(Array.isArray(data.links)){
    raw=data.links.map(l=>({id:l.id,url:l.url,icon:l.icon,iconColor:l.iconColor||DEFAULT_ICON_COLOR,name:l.name||'',col:undefined,row:undefined}));
  }else{
    return [];
  }
  const placed=[];
  raw.forEach(ic=>{
    const hasValidPos=Number.isInteger(ic.col)&&Number.isInteger(ic.row)&&
      ic.col>=0&&ic.col<gridCols&&ic.row>=0&&ic.row<gridRows&&
      !placed.some(p=>p.col===ic.col&&p.row===ic.row);
    if(hasValidPos){
      placed.push(ic);
    }else{
      const free=firstFreeCell(placed);
      if(free)placed.push({...ic,col:free.col,row:free.row});
    }
  });
  return placed;
}
function firstFreeCell(against){
  for(let r=0;r<gridRows;r++){
    for(let c=0;c<gridCols;c++){
      if(!against.some(p=>p.col===c&&p.row===r))return {col:c,row:r};
    }
  }
  return null;
}

// ── Icon rendering ───────────────────────────────────────────────
function iconUrl(icon,size,color){
  const [prefix,name]=icon.split(':');
  const c=encodeURIComponent(color||DEFAULT_ICON_COLOR);
  return `https://api.iconify.design/${prefix}/${name}.svg?height=${size||64}&color=${c}`;
}
document.getElementById('main-knot-img').src=iconUrl(EDIT_KNOT_ICON,20,'#c3b394');
document.getElementById('bday-knot-img').src=iconUrl(BDAY_KNOT_ICON,20,'#c3b394');

// ── Icon grid (live view) ─────────────────────────────────────────
function renderGrid(){
  const grid=document.getElementById('icon-grid');
  grid.style.gridTemplateColumns=`repeat(${gridCols},1fr)`;
  grid.innerHTML=icons.map(ic=>{
    const title=ic.name?ic.name:ic.url;
    return `<button class="grid-icon" data-id="${ic.id}" title="${title}" style="grid-column:${ic.col+1};grid-row:${ic.row+1}">
      <img src="${iconUrl(ic.icon,48,ic.iconColor)}" alt="" loading="lazy">
    </button>`;
  }).join('');
  grid.querySelectorAll('.grid-icon').forEach(el=>{
    el.addEventListener('click',()=>{
      const ic=icons.find(x=>x.id===el.getAttribute('data-id'));
      if(ic)window.open(ic.url,'_blank','noopener');
    });
  });
  document.getElementById('grid-toggle').textContent=icons.length?`Icons (${icons.length}) ▾`:'';
  document.getElementById('grid-toggle').style.display=icons.length?'':'none';
  reportHeight();
}
window.addEventListener('resize',reportHeight);

document.getElementById('grid-toggle').addEventListener('click',()=>{
  const wrap=document.getElementById('icon-grid-wrap');
  const grid=document.getElementById('icon-grid');
  const nowExpanded=wrap.classList.toggle('expanded');
  grid.classList.toggle('expanded-grid',nowExpanded);
  document.getElementById('grid-toggle').textContent=nowExpanded?'▴':`Icons (${icons.length}) ▾`;
  reportHeight();
});

// ── Edit pane ──────────────────────────────────────────────────────
function openEditPane(){
  renderEditPane();
  requestFullHeight();
  document.getElementById('edit-modal').classList.remove('hidden');
}
function closeEditPane(){
  document.getElementById('edit-modal').classList.add('hidden');
  releaseFullHeight();
  renderGrid();
}
document.getElementById('main-knot').addEventListener('click',openEditPane);
document.getElementById('close-edit').addEventListener('click',closeEditPane);
document.getElementById('add-icon-btn').addEventListener('click',()=>{
  const free=firstFreeCell(icons);
  if(!free){alert('The grid is full — resize it (top of this pane) or remove an icon first.');return;}
  openIconPicker(icon=>{
    icons.push({id:'icon_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),url:'https://',icon,iconColor:DEFAULT_ICON_COLOR,name:'',col:free.col,row:free.row});
    persist();renderEditPane();
  });
});

document.getElementById('grid-dims-input').addEventListener('change',e=>{
  const errEl=document.getElementById('grid-dims-err');
  errEl.textContent='';
  const m=e.target.value.trim().match(/^(\d+)\s*[xX]\s*(\d+)$/);
  if(!m){errEl.textContent='Use the format 10x3 (columns x rows).';e.target.value=`${gridCols}x${gridRows}`;return;}
  const newCols=parseInt(m[1],10), newRows=parseInt(m[2],10);
  if(newCols<1||newRows<1){errEl.textContent='Needs at least 1 column and 1 row.';e.target.value=`${gridCols}x${gridRows}`;return;}
  if(newCols>MAX_GRID_COLS||newRows>MAX_GRID_ROWS){errEl.textContent=`${MAX_GRID_COLS}x${MAX_GRID_ROWS} max.`;e.target.value=`${gridCols}x${gridRows}`;return;}
  const stranded=icons.find(ic=>ic.col>=newCols||ic.row>=newRows);
  if(stranded){
    errEl.textContent=`Can't shrink to ${newCols}x${newRows} — "${stranded.name||stranded.url}" no longer fits. Move or remove it first.`;
    e.target.value=`${gridCols}x${gridRows}`;
    return;
  }
  gridCols=newCols;gridRows=newRows;
  persist();renderGrid();renderEditPane();
});

// ── Drag-and-drop position grid (build 14) ──────────────────────────
// Replaces the "type A1" system entirely. Native HTML5 drag-and-drop:
// dragging an icon onto an occupied cell SWAPS the two icons' positions;
// dropping onto an empty cell just moves it there. No separate position
// field anywhere anymore -- this is the only way to reposition an icon.
let dragFromId=null;
function renderDragGrid(){
  const wrap=document.getElementById('drag-grid');
  wrap.style.gridTemplateColumns=`repeat(${gridCols},1fr)`;
  let cells='';
  for(let r=0;r<gridRows;r++){
    for(let c=0;c<gridCols;c++){
      const occupant=icons.find(ic=>ic.col===c&&ic.row===r);
      cells+=`<div class="drag-cell" data-col="${c}" data-row="${r}">${occupant?
        `<div class="drag-icon" draggable="true" data-id="${occupant.id}" title="${occupant.name||occupant.url}">
          <img src="${iconUrl(occupant.icon,32,occupant.iconColor)}" alt="">
        </div>`:''}</div>`;
    }
  }
  wrap.innerHTML=cells;

  wrap.querySelectorAll('.drag-icon').forEach(el=>{
    el.addEventListener('dragstart',e=>{
      dragFromId=el.getAttribute('data-id');
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');dragFromId=null;});
  });
  wrap.querySelectorAll('.drag-cell').forEach(cell=>{
    cell.addEventListener('dragover',e=>{e.preventDefault();cell.classList.add('drag-over');});
    cell.addEventListener('dragleave',()=>cell.classList.remove('drag-over'));
    cell.addEventListener('drop',e=>{
      e.preventDefault();cell.classList.remove('drag-over');
      if(!dragFromId)return;
      const targetCol=parseInt(cell.getAttribute('data-col'),10), targetRow=parseInt(cell.getAttribute('data-row'),10);
      const dragged=icons.find(ic=>ic.id===dragFromId);
      if(!dragged)return;
      const occupant=icons.find(ic=>ic.id!==dragFromId&&ic.col===targetCol&&ic.row===targetRow);
      if(occupant){
        // swap
        const oc=occupant.col, or_=occupant.row;
        occupant.col=dragged.col;occupant.row=dragged.row;
        dragged.col=targetCol;dragged.row=targetRow;
      }else{
        dragged.col=targetCol;dragged.row=targetRow;
      }
      persist();renderDragGrid();renderGrid();renderEditPane();
    });
  });
}

let iconPickCallback=null, searchDebounce=null;
function openIconPicker(onPick){
  iconPickCallback=onPick;
  document.getElementById('icon-query').value='';
  document.getElementById('icon-search-results').innerHTML='';
  document.getElementById('icon-search-status').textContent='';
  document.getElementById('icon-pick-modal').classList.remove('hidden');

document.getElementById('close-icon-pick').addEventListener('click',()=>{
  document.getElementById('icon-pick-modal').classList.add('hidden');
});
document.getElementById('icon-query').addEventListener('input',e=>{
  const q=e.target.value.trim();
  clearTimeout(searchDebounce);
  if(!q){document.getElementById('icon-search-results').innerHTML='';document.getElementById('icon-search-status').textContent='';return;}
  document.getElementById('icon-search-status').textContent='Searching…';
  searchDebounce=setTimeout(()=>runIconSearch(q),350);
});
async function runIconSearch(query){
  const statusEl=document.getElementById('icon-search-status');
  const resultsEl=document.getElementById('icon-search-results');
  try{
    const res=await fetch(`https://api.iconify.design/search?query=${encodeURIComponent(query)}&limit=64`);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const iconsFound=data.icons||[];
    if(!iconsFound.length){resultsEl.innerHTML='';statusEl.textContent='No icons found for "'+query+'"';return;}
    statusEl.textContent='';
    resultsEl.innerHTML=iconsFound.map(id=>`<div class="res" data-icon="${id}"><img src="${iconUrl(id,40)}" loading="lazy" alt=""></div>`).join('');
    resultsEl.querySelectorAll('.res').forEach(el=>{
      el.addEventListener('click',()=>{
        const icon=el.getAttribute('data-icon');
        document.getElementById('icon-pick-modal').classList.add('hidden');
        if(iconPickCallback)iconPickCallback(icon);
      });
    });
  }catch(err){
    resultsEl.innerHTML='';
    statusEl.textContent='Icon search unavailable right now — try again in a moment.';
  }
}

// followed by the fully-written-out French date, e.g. "Bonjour, le
// premier septembre." instead of "Bonjour !") ──────────────────────
const FR_MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const FR_DAYS=[null,'premier','deux','trois','quatre','cinq','six','sept','huit','neuf','dix',
  'onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf','vingt',
  'vingt et un','vingt-deux','vingt-trois','vingt-quatre','vingt-cinq','vingt-six','vingt-sept','vingt-huit','vingt-neuf','trente','trente et un'];
function frenchDate(d){
  return `le ${FR_DAYS[d.getDate()]} ${FR_MONTHS[d.getMonth()]}`;
}
function timeGreeting(d){
  const h=d.getHours();
  if(h>=5&&h<12)return 'Bonjour';
  if(h>=12&&h<18)return 'Bon après-midi';
  if(h>=18&&h<22)return 'Bonsoir';
  return 'Bonne nuit';
}
function mainGreeting(d){
  return `${timeGreeting(d)}, nous sommes ${frenchDate(d)}.`;
}

function nthWeekdayOfMonth(year,month,weekday,n){
  const d=new Date(year,month,1);
  let count=0;
  while(d.getMonth()===month){
    if(d.getDay()===weekday){count++;if(count===n)return new Date(d);}
    d.setDate(d.getDate()+1);
  }
  return null;
}
function lastWeekdayOfMonth(year,month,weekday){
  const d=new Date(year,month+1,0);
  while(d.getDay()!==weekday)d.setDate(d.getDate()-1);
  return d;
}
function sameDate(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}

function floatingHolidaysForYear(year){
  const out=[];
  const push=(date,name,greeting,solemn)=>{if(date)out.push({date,name,greeting:greeting||null,solemn:!!solemn});};
  push(nthWeekdayOfMonth(year,0,1,3),'Martin Luther King Jr. Day',null,true);

  push(febThirdMon,"le Presidents' Day",null,true);

  const lastMonMay=lastWeekdayOfMonth(year,4,1);
  push(lastMonMay,'le Memorial Day',null,true);
  push(lastMonMay,'la fête de Victoria','Bonne fête de Victoria !');
  push(lastMonMay,'la Journée nationale des patriotes','Bonne Journée des Patriotes !');
  push(nthWeekdayOfMonth(year,8,1,1),'la fête du Travail','Bonne fête du Travail !');
  const octSecondMon=nthWeekdayOfMonth(year,9,1,2);
  push(octSecondMon,"l'Action de grâce",'Joyeux Action de grâce !');
  push(octSecondMon,'le Columbus Day',null,true);
  push(nthWeekdayOfMonth(year,10,4,4),'le Thanksgiving',"Bon Thanksgiving !");
  return out;
}

  {y:2030,m:4, d:17,y2:2030,m2:4, d2:24,name:'Pessah',greeting:"'Hag Pessah Sameah !"},
  {y:2030,m:6, d:6, y2:2030,m2:6, d2:7, name:'Chavouot',greeting:"'Hag Sameah !"},
  {y:2030,m:8, d:7, y2:2030,m2:8, d2:8, name:"Tisha b'Av",greeting:null,solemn:true},
];

function todaysHolidays(now){
  const y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate();
  const hits=[];
  FIXED_HOLIDAYS.forEach(h=>{if(h.month===m&&h.day===d)hits.push(h);});
  floatingHolidaysForYear(y).forEach(h=>{if(sameDate(h.date,now))hits.push(h);});
  const todayDate=new Date(y,m-1,d);
  JEWISH_HOLIDAYS.forEach(h=>{
    const start=new Date(h.y,h.m-1,h.d),end=new Date(h.y2,h.m2-1,h.d2);
    if(todayDate>=start&&todayDate<=end)hits.push(h);
  });
  return hits;
}

function birthdaysToday(now){
  const m=now.getMonth()+1,d=now.getDate();
  return birthdays.filter(b=>b.month===m&&b.day===d);
}

function renderCanopy(){
  const now=new Date();
  const mainEl=document.getElementById('canopy-main');
  const subEl=document.getElementById('canopy-sub');
  if(!mainEl||!subEl)return;
  mainEl.textContent=mainGreeting(now);
  const lines=[];
  const holidays=todaysHolidays(now);
  if(holidays.length){
    lines.push(`<div class="cs-holiday">${holidays.map(h=>h.solemn?h.name:(h.greeting||h.name)).join(' · ')}</div>`);
  }
  const todayBdays=birthdaysToday(now);
  if(todayBdays.length){
    lines.push(`<div class="cs-bday">${todayBdays.map(b=>`Bon anniversaire ${b.name} !`).join(' · ')}</div>`);
  }
  subEl.innerHTML=lines.join('');
  reportHeight();
}
setInterval(renderCanopy,60000);

// ── Height reporting + modal full-height requests ───────────────
let lastReportedHeight=0;
let modalOpenCount=0;
function reportHeight(){
  requestAnimationFrame(()=>{
    const h=Math.ceil(document.getElementById('app').getBoundingClientRect().height);
    if(Math.abs(h-lastReportedHeight)<4)return;
    lastReportedHeight=h;
    try{window.parent.postMessage({type:'app-resize',id:'branche',height:h},window.location.origin);}catch(e){}
  });
}
function requestFullHeight(){
  modalOpenCount++;
  try{window.parent.postMessage({type:'modal-open',id:'branche'},window.location.origin);}catch(e){}
}
function releaseFullHeight(){
  modalOpenCount=Math.max(0,modalOpenCount-1);
  if(modalOpenCount>0)return;
  try{window.parent.postMessage({type:'modal-close',id:'branche'},window.location.origin);}catch(e){}
  reportHeight();
}
if(window.ResizeObserver){new ResizeObserver(reportHeight).observe(document.getElementById('app'));}
